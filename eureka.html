// ── Utilitaires Streak 21 jours ────────────────────────────────────
// Le streak compte les ÉCOUTES consécutives de la séance personnelle (pas les générations).
function getToday() { return new Date().toISOString().slice(0, 10); }

function loadStreak() {
  try {
    const raw = localStorage.getItem('eureka_streak');
    if (!raw) return { lastDate: null, streak: 0 };
    return JSON.parse(raw);
  } catch { return { lastDate: null, streak: 0 }; }
}

function saveStreak(data) {
  try { localStorage.setItem('eureka_streak', JSON.stringify(data)); } catch {}
}

function incrementStreakOnPlay() {
  const today = getToday();
  const current = loadStreak();
  const { lastDate, streak } = current;
  if (lastDate === today) return current;
  if (!lastDate) { const s = { lastDate: today, streak: 1 }; saveStreak(s); return s; }
  const yest = new Date(today); yest.setDate(yest.getDate() - 1);
  const yestStr = yest.toISOString().slice(0, 10);
  const newStreak = lastDate === yestStr ? Math.min(streak + 1, 21) : 1;
  const s = { lastDate: today, streak: newStreak };
  saveStreak(s); return s;
}

function resetStreak() {
  try { localStorage.removeItem('eureka_streak'); } catch {}
}

// ── IndexedDB : sauvegarde de la séance personnelle (audio + script + profil) ──
const IDB_NAME = 'eureka_db';
const IDB_STORE = 'sessions';
function idbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function saveSession(data) {
  try {
    const db = await idbOpen();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).put(data, 'current');
      tx.oncomplete = () => { db.close(); resolve(true); };
      tx.onerror = () => { db.close(); reject(tx.error); };
    });
  } catch (e) { console.warn('IDB save failed:', e); return false; }
}
async function loadSession() {
  try {
    const db = await idbOpen();
    return new Promise((resolve) => {
      const tx = db.transaction(IDB_STORE, 'readonly');
      const req = tx.objectStore(IDB_STORE).get('current');
      req.onsuccess = () => { db.close(); resolve(req.result || null); };
      req.onerror = () => { db.close(); resolve(null); };
    });
  } catch { return null; }
}
async function deleteSession() {
  try {
    const db = await idbOpen();
    return new Promise((resolve) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).delete('current');
      tx.oncomplete = () => { db.close(); resolve(true); };
      tx.onerror = () => { db.close(); resolve(false); };
    });
  } catch { return false; }
}
function setSessionFlag(present, meta) {
  try {
    if (present) localStorage.setItem('eureka_session_meta', JSON.stringify(meta || {}));
    else localStorage.removeItem('eureka_session_meta');
  } catch {}
}
function getSessionFlag() {
  try {
    const raw = localStorage.getItem('eureka_session_meta');
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}

// BIG FIVE — Modèle de personnalité scientifiquement validé (OCEAN)
// Inventaire BFI-10 (Rammstedt & John, 2007)
// 10 items, échelle Likert 1-5, 5 dimensions indépendantes
// Validation interculturelle ~50 pays, héritabilité 40-60%, stabilité ~0.7 sur 30 ans.
// ══════════════════════════════════════════════════════════════════
const BFI10 = [
  { dim: "E", reverse: true,  text: "Je me vois comme quelqu'un de réservé." },
  { dim: "A", reverse: false, text: "Je me vois comme quelqu'un de naturellement confiant envers les autres." },
  { dim: "C", reverse: true,  text: "Je me vois comme quelqu'un qui a tendance à être paresseux(se)." },
  { dim: "N", reverse: true,  text: "Je me vois comme quelqu'un de détendu(e), qui gère bien le stress." },
  { dim: "O", reverse: true,  text: "Je me vois comme quelqu'un qui s'intéresse peu à l'art ou aux expériences esthétiques." },
  { dim: "E", reverse: false, text: "Je me vois comme quelqu'un d'extraverti(e), de sociable." },
  { dim: "A", reverse: true,  text: "Je me vois comme quelqu'un qui critique facilement les autres." },
  { dim: "C", reverse: false, text: "Je me vois comme quelqu'un de consciencieux(se), qui fait son travail à fond." },
  { dim: "N", reverse: false, text: "Je me vois comme quelqu'un qui s'inquiète facilement, qui devient nerveux(se)." },
  { dim: "O", reverse: false, text: "Je me vois comme quelqu'un d'imaginatif(ve), qui aime réfléchir." },
];
const LIKERT_LABELS = [
  { v: 1, text: "Pas du tout d'accord" },
  { v: 2, text: "Plutôt pas d'accord" },
  { v: 3, text: "Neutre / sans avis" },
  { v: 4, text: "Plutôt d'accord" },
  { v: 5, text: "Tout à fait d'accord" },
];
const BIG_FIVE_NAMES = {
  O: "Ouverture", C: "Conscienciosité", E: "Extraversion",
  A: "Agréabilité", N: "Névrosisme"
};
const BIG_FIVE_DESC = {
  O: "Ouverture aux idées, métaphores, abstractions et nouvelles expériences",
  C: "Préférence pour la structure, la discipline, les protocoles précis",
  E: "Énergie tirée du monde extérieur (vs introspection)",
  A: "Tendance à la confiance, à la coopération, à la chaleur relationnelle",
  N: "Sensibilité émotionnelle, tendance à l'anxiété, besoin de validation"
};
function scoreBigFive(answers) {
  const dims = { O: [], C: [], E: [], A: [], N: [] };
  BFI10.forEach((q, i) => {
    const raw = answers[i];
    if (raw == null) return;
    const score = q.reverse ? (6 - raw) : raw;
    dims[q.dim].push(score);
  });
  const result = {};
  for (const k of ["O","C","E","A","N"]) {
    if (dims[k].length === 0) { result[k] = 50; continue; }
    const avg = dims[k].reduce((s,v) => s+v, 0) / dims[k].length;
    result[k] = Math.round(((avg - 1) / 4) * 100);
  }
  return result;
}
function bigFiveLevel(score) {
  if (score >= 70) return "Élevé";
  if (score >= 55) return "Moyen-haut";
  if (score >= 45) return "Moyen";
  if (score >= 30) return "Moyen-bas";
  return "Bas";
}

// Chaque archétype mappe vers un des 4 audio blocs existants pour réutiliser

function archetypeFromBigFive(s) {
  if (!s) return "compagnon";
  if (s.O >= 60 && (s.A >= 50 || s.N >= 50)) return "pelerin";
  if (s.C >= 60 && s.O <= 55) return "batisseur";
  if (s.A >= 60 && s.E <= 60) return "compagnon";
  if (s.E >= 60 && s.N <= 50) return "voyageur";
  const top = Object.entries({O:s.O, C:s.C, E:s.E, A:s.A}).sort((a,b)=>b[1]-a[1])[0][0];
  return { O:"pelerin", C:"batisseur", A:"compagnon", E:"voyageur" }[top] || "compagnon";
}

  // Logique : haute Conscienciosité + basse Névrose → rythme rapide (efficacité)
  //          haute Névrose ou haute Ouverture → rythme contemplatif (apaisement)
  //          sinon → rythme standard
  const bf = bigFiveScores || { O:50, C:50, E:50, A:50, N:50 };
  let breath;
  if (bf.C >= 65 && bf.N <= 45 && bf.E >= 55) breath = { inspire:4, hold:2, expire:6 }; // pressé/efficace
  else if (bf.N >= 60 || bf.O >= 70) breath = { inspire:5, hold:2, expire:10 };          // contemplatif/apaisant
  else breath = { inspire:4, hold:2, expire:8 };                                          // standard
  const NUM_FR = { 2:"deux", 4:"quatre", 5:"cinq", 6:"six", 8:"huit", 10:"dix" };
  const COUNT_WORDS = ["un","deux","trois","quatre","cinq","six","sept","huit","neuf","dix"];
  // Fix bug : 6 ellipses force une pause d'environ 1s entre chaque mot dans ElevenLabs
  // (les [PAUSE_0.5s] étaient supprimés par le parseur SPLIT_THRESHOLD=2.0)
  const buildCount = (n) => COUNT_WORDS.slice(0,n).map(w => w + "......").join(" ");
  const expirePauseSec = Math.max(6, breath.expire - 2);
  // Fix bug "huit-e temps" : ellipse entre le nombre et "temps" pour casser la liaison TT
  const inTemps = (n) => "en " + NUM_FR[n] + "... temps...";

  const vakogStyle = vakog === 'V' ? "Metaphores VISUELLES : couleurs, formes, lumieres, images" :
    vakog === 'A' ? "Metaphores AUDITIVES : sons, musiques, voix, melodies" :
    vakog === 'K' ? "Metaphores KINESTH.: sensations, chaleur, poids, fluidite" :
    "Langage logique et clair";

  const groupesTF = "GROUPES TETE vers PIEDS:\n" +
    "Groupe TETE: cuir chevelu, oreilles, front, sourcils, paupieres, yeux, nez, joues, bouche, levres, interieur bouche, langue, machoire, menton - chacun: phrase invitation detente + [PAUSE_3s] - puis annoncer toute la tete detendue [PAUSE_5s]\n" +
    "Groupe COU: cou, nuque, vertebres cervicales - chacun [PAUSE_3s] - puis annoncer cou detendu [PAUSE_5s]\n" +
    "Groupe MEMBRES SUP: epaules, bras D, bras G, coudes, avant-bras, poignets, mains, pouces, index, majeurs, annulaires, auriculaires - chacun [PAUSE_3s] - puis annoncer membres sup detendus [PAUSE_5s]\n" +
    "Groupe TRONC: vertebres dorsales, lombaires, cage thoracique, poitrine, ventre, abdominaux, coeur, poumons, estomac, foie, reins, intestins - chacun [PAUSE_3s] - puis annoncer tronc et organes en paix [PAUSE_5s]\n" +
    "Groupe MEMBRES INF: bassin, fesses, cuisses, genoux, mollets, chevilles, pieds, talons, plante pieds, gros orteils, deuxièmes, troisièmes, quatrièmes, petits orteils - chacun [PAUSE_3s] - puis annoncer tout le corps detendu [PAUSE_5s]";

  const groupesFT = "GROUPES PIEDS vers TETE:\n" +
    "Groupe MEMBRES INF: petits orteils, 4e, 3e, 2e, gros orteils, plante pieds, talons, pieds, chevilles, mollets, genoux, cuisses, fesses, bassin - chacun [PAUSE_3s] - puis annoncer membres inf detendus [PAUSE_5s]\n" +
    "Groupe TRONC: intestins, reins, foie, estomac, poumons, coeur, abdominaux, ventre, poitrine, cage thoracique, vertebres lombaires, dorsales - chacun [PAUSE_3s] - puis annoncer tronc en paix [PAUSE_5s]\n" +
    "Groupe MEMBRES SUP: auriculaires, annulaires, majeurs, index, pouces, mains, poignets, avant-bras, coudes, bras G, bras D, epaules - chacun [PAUSE_3s] - puis annoncer membres sup detendus [PAUSE_5s]\n" +
    "Groupe COU: vertebres cervicales, nuque, cou - chacun [PAUSE_3s] - puis annoncer cou detendu [PAUSE_5s]\n" +
    "Groupe TETE: menton, machoire, langue, interieur bouche, levres, bouche, joues, nez, yeux, paupieres, sourcils, front, oreilles, cuir chevelu - chacun [PAUSE_3s] - puis annoncer tete detendue [PAUSE_5s]";

  const groupes = relaxDir === 'TF' ? groupesTF : groupesFT;

  const spirituel = beliefSystem === 'croyant' ?
    "Puis affirmations connexion divine, lumiere, victoire acquise, Namaste." :
    beliefSystem === 'spirituel' ?
    "Puis affirmations amour, paix, transformation, gratitude." :
    "Puis affirmations ressources interieures, courage, progression.";

  // ─── PERSONNALISATION BIG FIVE — 5 leviers thérapeutiques indépendants ─
  // Chaque dimension produit une instruction de personnalisation linguistique
  // basée sur les conclusions empiriques de la psychologie de la personnalité.
  const bigFiveDirectives = [];
  if (bf.N >= 60) bigFiveDirectives.push("NÉVROSISME ÉLEVÉ (" + bf.N + "/100) → utilise systématiquement un langage VALIDANT et SÉCURISANT. Multiplie les rappels « vous êtes en sécurité ici », « tout va bien », « ne forcez rien », « à votre rythme ». ÉVITE tout ton injonctif. Désamorce l'anxiété avant chaque transition.");
  else if (bf.N <= 40) bigFiveDirectives.push("NÉVROSISME BAS (" + bf.N + "/100) → la personne tolère bien la directivité. Tu peux utiliser des consignes FERMES et DIRECTES (« lâchez prise maintenant », « relâchez cette tension »). Pas besoin d'envelopper chaque consigne.");
  else bigFiveDirectives.push("NÉVROSISME MOYEN (" + bf.N + "/100) → ton équilibré, ni trop directif, ni trop validant.");

  if (bf.O >= 60) bigFiveDirectives.push("OUVERTURE ÉLEVÉE (" + bf.O + "/100) → utilise des MÉTAPHORES RICHES, images abstraites, voyage symbolique, transformation poétique. La personne aime explorer mentalement.");
  else if (bf.O <= 40) bigFiveDirectives.push("OUVERTURE BASSE (" + bf.O + "/100) → utilise des images CONCRÈTES, sensations corporelles tangibles, langage simple et direct. ÉVITE les métaphores trop abstraites.");
  else bigFiveDirectives.push("OUVERTURE MOYENNE (" + bf.O + "/100) → mélange équilibré entre images concrètes et symboliques.");

  if (bf.C >= 60) bigFiveDirectives.push("CONSCIENCIOSITÉ ÉLEVÉE (" + bf.C + "/100) → insiste sur la STRUCTURE du protocole (« étape 1, étape 2 »), sur la régularité (« 21 jours consécutifs »), sur la précision des instructions. La personne aime un cadre clair et mesurable.");
  else if (bf.C <= 40) bigFiveDirectives.push("CONSCIENCIOSITÉ BASSE (" + bf.C + "/100) → ÉVITE les injonctions de discipline. Privilégie un cadre SOUPLE (« quand vous le souhaitez », « comme cela vient »), sans rigidité. Pas de pression de performance.");
  else bigFiveDirectives.push("CONSCIENCIOSITÉ MOYENNE (" + bf.C + "/100) → structure légère, sans rigidité.");

  if (bf.E >= 60) bigFiveDirectives.push("EXTRAVERSION ÉLEVÉE (" + bf.E + "/100) → utilise des images d'ÉNERGIE, de DYNAMISME, de lumière qui rayonne, de mouvement, de chaleur active. ÉVITE les scènes trop introspectives ou silencieuses prolongées.");
  else if (bf.E <= 40) bigFiveDirectives.push("EXTRAVERSION BASSE / INTROVERSION (" + bf.E + "/100) → utilise des images d'INTROSPECTION, de calme profond, de silence intérieur, de retraite. La personne se nourrit du dedans. Privilégie les pauses longues.");
  else bigFiveDirectives.push("EXTRAVERSION MOYENNE (" + bf.E + "/100) → équilibre entre énergie et introspection.");

  if (bf.A >= 60) bigFiveDirectives.push("AGRÉABILITÉ ÉLEVÉE (" + bf.A + "/100) → utilise un langage RELATIONNEL et CHALEUREUX (« vous méritez », « ensemble », « vous êtes aimé(e) », « vous comptez »). La personne répond à la connexion humaine.");
  else if (bf.A <= 40) bigFiveDirectives.push("AGRÉABILITÉ BASSE (" + bf.A + "/100) → RESPECTE l'autonomie (« c'est votre choix », « vous décidez seul(e) »). ÉVITE les injonctions affectives ou les « nous » trop appuyés. La personne est plus autonome qu'affiliative.");
  else bigFiveDirectives.push("AGRÉABILITÉ MOYENNE (" + bf.A + "/100) → chaleur mesurée, pas trop affective.");

  // Ton général dérivé de l'archétype dominant
  const archetypeTon = {
    pelerin: "poétique, profond, métaphorique, exploration intérieure",
    batisseur: "structuré, précis, méthodique, orienté résultat",
    compagnon: "chaleureux, protecteur, enveloppant, sécurisant",
    voyageur: "présent, sensoriel, vivant, ancré dans le corps"
  }[archetypeKey] || "équilibré et apaisant";

  // Bloc balises ElevenLabs v3 (uniquement si voix Mickaël v3 sélectionnée)
  const v3TagsInstructions = useV3Tags ? (
    "BALISES EXPRESSIVES V3 (à insérer AUX TRANSITIONS UNIQUEMENT, max 8-10 sur tout le script):\n" +
    "- [soft] avant les invitations corporelles douces\n" +
    "- [whispers] avant l'entrée en sophro-liminalité\n" +
    "- [calm] avant la phase alpha et les scènes intérieures\n" +
    "- [warm] avant les affirmations finales\n" +
    "- [gentle] avant la désophronisation\n" +
    "INTERDIT: balise sur chaque phrase. UNIQUEMENT les 5 balises ci-dessus. Place la balise EN DÉBUT de phrase, suivie d'un espace.\n\n"
  ) : "";

  return "Tu es un sophrologue expert. Tu generes un script audio de seance.\n" +
    "Le client entend CHAQUE MOT. AUCUN TITRE dans le texte.\n\n" +
    "CLIENT: " + prenom + " | ARCHÉTYPE: " + archetype.name + " | VAKOG: " + vakog + " (" + vakogStyle + ")\n" +
    "PROBLEMES: " + problem + "\n" +
    "OBJECTIFS: " + objectif + "\n" +
    "SPIRITUALITE: " + beliefSystem + "\n\n" +
    "PROFIL BIG FIVE (BFI-10, validé scientifiquement) — ADAPTE TOUT LE SCRIPT EN FONCTION DE CHAQUE DIMENSION:\n" +
    bigFiveDirectives.map(d => "- " + d).join("\n") + "\n\n" +
    "ARCHÉTYPE DOMINANT: " + archetype.name + " (" + archetype.desc + ")\n" +
    "Ton général de la séance: " + archetypeTon + "\n\n" +
    "REGLES ABSOLUES:\n" +
    "1. ZERO TITRE - jamais: [texte], ###, **, Phase, Scene, Cycle, Groupe, Introduction. Commencer DIRECTEMENT par les phrases therapeutiques.\n" +
    "2. JAMAIS resumer - tout ecrire integralement. Interdit: voir cycle 1, idem, meme texte.\n" +
    "3. RESPIRATION EXACTE: Inspirez maintenant... lentement... " + inTemps(breath.inspire) + " " + buildCount(breath.inspire) + " Bloquez doucement... " + buildCount(breath.hold) + " Et expirez... tout doucement... " + inTemps(breath.expire) + " laissez partir toutes les tensions... [PAUSE_" + expirePauseSec + "s] - ne pas changer un mot. 3e respiration = [PAUSE_10s].\n" +
    "4. DETENDRE pas enumerer - chaque partie = phrase invitation + [PAUSE_3s].\n" +
    "5. PAS DE NEGATION - son emprise s est evaporee - pas n a plus de pouvoir.\n" +
    "6. PAUSES: installation=[PAUSE_3s] respiration=[PAUSE_6s] derniere resp=[PAUSE_10s] corps=[PAUSE_3s] groupe=[PAUSE_5s] alpha=[PAUSE_15s]\n" +
    "7. PAUSE ENTRE PHRASES: apres chaque phrase courte ajouter [PAUSE_1s]. Exemple: Je vous invite a vous installer... [PAUSE_1s] Laissez votre corps s abandonner... [PAUSE_1s] Vos mains reposent... [PAUSE_1s]\n\n" +
    "STYLE HYPNOTIQUE OBLIGATOIRE:\n" +
    "8. PHRASES COURTES - maximum 10 mots par phrase. Jamais de longue phrase explicative.\n" +
    "9. RYTHME BRISE - une idee par ligne. Espace entre chaque pensee. Laisser le silence travailler.\n" +
    "10. LANGAGE SENSORIEL - utiliser le canal " + vakog + " a chaque etape. Faire RESSENTIR, pas expliquer.\n" +
    "11. REPETITION HYPNOTIQUE - les mots cles reviennent... encore... et encore... comme une vague.\n" +
    "12. PRESENT DIRECT - pas de conditionnel. Pas 'vous pourriez'. Dire 'vous ressentez... vous lâchez... vous etes'.\n" +
    "13. VERBES D ACTION LENTS - fondre, glisser, lacher, s'ouvrir, s'approfondir, se dissoudre.\n\n" +
    "GROUPES MUSCULAIRES:\n" + groupes + "\n\n" +
    v3TagsInstructions +
    "SPIRITUALITE:\n" +
    "Je cultive l amour... je cultive la verite... je cultive la paix... je fais toujours de mon mieux maintenant...\n" +
    spirituel;
}

              display:"flex", alignItems:"center", justifyContent:"center",

// COMPOSANT : STREAK BANNER 21 JOURS
// ══════════════════════════════════════════════════════════════════
function StreakBanner({ streak }) {
  const pct = Math.min(Math.round((streak / 21) * 100), 100);
  const isDone = streak >= 21;

  const msg = streak === 0
    ? "Générez votre première séance pour commencer"
    : streak === 1 ? "Excellent début ! Revenez demain pour maintenir votre progression ✨"
    : streak < 7  ? `🔥 Vous êtes à ${streak} jours consécutifs — vous êtes lancé(e) !`
    : streak < 14 ? `🔥 ${streak} jours — votre cerveau se reconfigure profondément !`
    : streak < 21 ? `🔥 ${streak} jours — vous approchez de la transformation complète !`
    : "";

  if (isDone) return (
    <div style={{ background:`linear-gradient(135deg,rgba(184,149,90,.2),rgba(42,138,143,.2))`,
      borderRadius:"16px", padding:"1.25rem 1.5rem", border:`1.5px solid ${C.gold}`,
      marginBottom:"1.5rem", textAlign:"center", animation:"fadeUp .5s ease" }}>
      <p style={{ fontSize:"28px", marginBottom:"0.5rem" }}>🎉</p>
      <p style={{ fontFamily:"'Cormorant Garamond', serif", fontSize:"20px", color:C.gold, fontWeight:"400" }}>
        Bravo, vous avez complété les 21 jours consécutifs !
      </p>
      <p style={{ fontSize:"12px", color:C.muted, marginTop:"0.5rem", lineHeight:"1.6" }}>
        La transformation est intégrée. Continuez à pratiquer pour maintenir les bénéfices.
      </p>
    </div>
  );

  return (
    <div style={{ background:C.card, borderRadius:"16px", padding:"1rem 1.25rem",
      border:`1px solid ${C.border}`, marginBottom:"1.25rem", animation:"fadeUp .5s ease" }}>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:"0.6rem" }}>
        <p style={{ fontSize:"13px", color:C.cream, fontFamily:"'Raleway',sans-serif", flex:1, paddingRight:"1rem", lineHeight:"1.5" }}>
          {msg}
        </p>
        <span style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:"22px", color:C.gold, flexShrink:0, whiteSpace:"nowrap" }}>
          Jour {streak} <span style={{ fontSize:"14px", color:C.muted }}>/ 21</span>
        </span>
      </div>
      <div style={{ height:"8px", background:C.border, borderRadius:"4px", overflow:"hidden" }}>
        <div style={{ height:"100%", borderRadius:"4px", width:`${pct}%`,
          background:`linear-gradient(90deg,${C.teal},${C.gold})`, transition:"width .6s ease" }} />
      </div>
    </div>
  );
}

function ReminderPanel() {
  const [permStatus, setPermStatus] = useState(
    typeof Notification !== 'undefined' ? Notification.permission : 'unsupported'
  );
  const [reminderTime, setReminderTime] = useState(() => {
    try { return localStorage.getItem('eureka_reminder_time') || '20:00'; } catch { return '20:00'; }
  });
  const [saved, setSaved] = useState(false);
  const [showFallback] = useState(() => {
    const { lastDate } = loadStreak();
    return lastDate !== getToday();
  });

  const requestPermission = async () => {
    if (typeof Notification === 'undefined') return;
    const p = await Notification.requestPermission();
    setPermStatus(p);
    if (p === 'granted') {
      new Notification("EUREKA Sophrologie 🌿", {
        body: "Prenez 5 minutes pour votre séance aujourd'hui 🌿",
        icon: "/favicon.ico"
      });
    }
  };

  const saveTime = () => {
    try { localStorage.setItem('eureka_reminder_time', reminderTime); } catch {}
    setSaved(true);
    setTimeout(() => setSaved(false), 2000);
  };

  return (
    <div style={{ background:C.card, borderRadius:"16px", padding:"1.25rem 1.5rem",
      border:`1px solid ${C.border}`, marginBottom:"1.5rem" }}>
      <h3 style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:"18px", color:C.cream,
        fontWeight:"400", marginBottom:"1rem" }}>🔔 Rappels quotidiens</h3>

      {showFallback && (
        <div style={{ background:"rgba(184,149,90,.1)", borderRadius:"10px",
          padding:"0.75rem 1rem", border:`1px solid ${C.gold}`, marginBottom:"1rem" }}>
          <p style={{ fontSize:"13px", color:C.goldLight, lineHeight:"1.6" }}>
            🌿 N'oubliez pas votre séance aujourd'hui
          </p>
        </div>

  const archetypeKey = archetypeFromBigFive(bigFiveScores);

  const isIntrovertBF = bigFiveScores ? bigFiveScores.E < 50 : false;

  const recommendMusic = (prob) => {
    const p = (prob || "").toLowerCase();
    if (/stress|anxi|panique|peur|inqui|nervos|agit|tendu|tension/.test(p)) return "binaural";
    if (/deuil|perte|solitude|abandon|seul|rupture|manque|vide|chagrin/.test(p)) return "coeur";
    if (/ancr|dispers|perdu|focus|concentr|flott|instable/.test(p)) return "tambour";
    if (/fatigue|épuis|déprim|dépression|tristesse|mélanc|énergie|burn/.test(p)) return "relaxation";
    return "binaural";
  };

    { id:"tambour", icon:"🥁", name:"Tambour chamanique", desc:"200 BPM, Ondes Thêta, voyage intérieur" },

    { id:"binaural", icon:"🎧", name:"Battements binauraux", desc:"8 Hz Alpha, état sophrologique profond — casque obligatoire" },

  ];

  const canContinue = relaxDir && beliefSystem && selectedVoice && musicChoice;

  const playPreview = async (voice) => {
    // Stop si déjà en lecture
    if (playingPreview === voice.id) {
      audioRef.current?.pause();
      setPlayingPreview(null);
      return;
    }
    setPlayingPreview(voice.id + "_loading");
    try {
      // Générer un court extrait à la demande via ElevenLabs
      const previewText = "Bonjour... installez-vous confortablement... respirez doucement... et laissez la détente s'installer naturellement en vous...";

        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: previewText, voiceId: voice.id })
      });
      if (r.ok) {
        const blob = await r.blob();
        const url = URL.createObjectURL(blob);
        if (audioRef.current) {
          audioRef.current.pause();
          audioRef.current.src = url;
          audioRef.current.play();
          setPlayingPreview(voice.id);

      while ((mx = pat.exec(activeScript)) !== null) {
        const t = activeScript.slice(li, mx.index).trim();
        if (t) rawParts.push({ type:"t", c:t });
        rawParts.push({ type:"s", sec:parseFloat(mx[1]) });
        li = mx.index + mx[0].length;
      }
      const rem = activeScript.slice(li).trim();
      if (rem) rawParts.push({ type:"t", c:rem });
      // Fusionner les textes séparés par des pauses courtes
      const parts = [];
      let mi = 0;
      while (mi < rawParts.length) {
        if (rawParts[mi].type === "t") {
          let merged = rawParts[mi].c;
          let mj = mi + 1;
          while (mj < rawParts.length) {
            if (rawParts[mj].type === "s" && rawParts[mj].sec < SPLIT_THRESHOLD) {
              if (mj + 1 < rawParts.length && rawParts[mj+1].type === "t") {
                merged += " " + rawParts[mj+1].c;
                mj += 2;
              } else { break; }
            } else { break; }
          }
          parts.push({ type:"t", c:merged });
          while (mj < rawParts.length && rawParts[mj].type === "s") {
            parts.push(rawParts[mj]);
            mj++;
          }
          mi = mj;
        } else {
          parts.push(rawParts[mi]);
          mi++;
        }
      }
      // Découpage des segments en respectant la limite du modèle (v3=2800, v2=4800)
      const fp = [];
      for (const p of parts) {
        if (p.type === "s") { fp.push(p); continue; }
        let tx = p.c;
        while (tx.length > MAX_TTS_CHARS) {
          let cut = tx.lastIndexOf("... ", MAX_TTS_CHARS);
          if (cut < 500) cut = tx.lastIndexOf(". ", MAX_TTS_CHARS);
          if (cut < 500) cut = MAX_TTS_CHARS;
          fp.push({ type:"t", c:tx.substring(0, cut+3) });
          tx = tx.substring(cut+3).trim();
        }
        if (tx) fp.push({ type:"t", c:tx });
      }
      const tc = fp.filter(p => p.type === "t").length;
      let done = 0;
      const allText = fp.filter(p => p.type === "t");
      for (const p of fp) {
        if (p.type === "s") { bufs.push(sil(p.sec)); continue; }
        done++;
        setFullGenMsg("Audio " + done + " / " + tc + " segments...");
        // Contexte vocal : segment précédent et suivant pour cohérence ElevenLabs

        const prevText = idx > 0 ? allText[idx-1].c : "";
        const nextText = idx < allText.length-1 ? allText[idx+1].c : "";
        const b = await ttsClient(p.c, prevText, nextText);
        if (b) {
          normalizeBuffer(b);
          applyFade(b);
          bufs.push(b);
        }
      }
      if (bufs.length > 0) {

        const comb = actx.createBuffer(1, tot, sr);
        const ch = comb.getChannelData(0);

        })()}

        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"0.5rem" }}>

        </div>

        {/* Rappels */}
        <div style={{ marginTop:"1.5rem" }}>
          <ReminderPanel />
        </div>

        {/* Premium teaser */}


        <div style={{ marginTop:"1rem", padding:"1rem", background:C.panel,
          borderRadius:"12px", border:`1px solid ${C.border}` }}>
          <p style={{ fontSize:"11px", color:C.muted, lineHeight:"1.7", textAlign:"center" }}>
            <strong style={{ color:C.goldLight }}>Protocole EUREKA — 21 séances</strong><br/>
            Écoutez votre séance chaque jour pendant 21 jours consécutifs pour ancrer la transformation durablement dans votre cerveau.
          </p>
        </div>

        {/* ╔═══════════════════════════════════════════╗
            ║  FEEDBACK — Retour anonyme post-séance    ║
            ╚═══════════════════════════════════════════╝ */}
        <div style={{ marginTop:"1.5rem", padding:"1.5rem", background:C.panel,
          borderRadius:"16px", border:`1.5px solid ${C.gold}` }}>
          {fbSent ? (

              <div style={{ width:"56px", height:"56px", borderRadius:"50%",
                background:"rgba(184,149,90,.18)", display:"flex", alignItems:"center",
                justifyContent:"center", margin:"0 auto 1rem", fontSize:"28px", color:C.gold,
                animation:"breathe 2.4s ease-in-out infinite" }}>✦</div>
              <h3 style={{ fontFamily:"'Cormorant Garamond', serif", fontSize:"22px",
                color:C.cream, fontWeight:"400", marginBottom:"0.5rem" }}>Merci.</h3>
              <p style={{ fontSize:"12px", color:C.muted, lineHeight:"1.7" }}>
                Ton retour nous aide à affiner les séances suivantes.
              </p>
            </div>
          ) : (
            <>
              <p style={{ fontSize:"10px", color:C.gold, letterSpacing:"2px",
                textTransform:"uppercase", marginBottom:"0.5rem", textAlign:"center" }}>
                Anonyme · facultatif
              </p>
              <h3 style={{ fontFamily:"'Cormorant Garamond', serif", fontSize:"22px",
                color:C.cream, fontWeight:"400", marginBottom:"0.5rem", textAlign:"center" }}>
                Si tu veux partager…
              </h3>
              <p style={{ fontSize:"12px", color:C.muted, lineHeight:"1.7",
                marginBottom:"1.5rem", textAlign:"center", fontStyle:"italic",
                fontFamily:"'Cormorant Garamond', serif" }}>
                Réponds aux questions qui t'inspirent, ignore les autres.
              </p>

              {/* Question 1 — Ressenti */}
              <div style={{ marginBottom:"1.25rem" }}>
                <p style={{ fontSize:"13px", color:C.cream, marginBottom:"0.5rem",
                  fontWeight:"500" }}>Comment te sens-tu ?</p>
                <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit, minmax(90px, 1fr))", gap:"0.5rem" }}>
                  {[
                    { v:"mieux",  emoji:"✦", label:"Mieux" },
                    { v:"pareil", emoji:"◯", label:"Pareil" },
                    { v:"pire",   emoji:"△", label:"Moins bien" },
                  ].map(o => (
                    <button key={o.v}
                      onClick={() => setFbFeel(fbFeel === o.v ? null : o.v)}
                      style={{
                        padding:"0.875rem 0.5rem", borderRadius:"12px", cursor:"pointer",
                        border:`2px solid ${fbFeel === o.v ? C.gold : C.border}`,
                        background: fbFeel === o.v ? "rgba(184,149,90,.12)" : C.bg,
                        color:C.cream, transition:"all .25s",
                        fontFamily:"'Raleway',sans-serif"
                      }}>
                      <div style={{ fontSize:"20px", color:C.gold, marginBottom:"4px" }}>{o.emoji}</div>
                      <div style={{ fontSize:"12px" }}>{o.label}</div>
                    </button>
                  ))}
                </div>
              </div>

              {/* Question 2 — Tarification */}
              <div style={{ marginBottom:"1.25rem" }}>
                <p style={{ fontSize:"13px", color:C.cream, marginBottom:"0.5rem",
                  fontWeight:"500" }}>Tu paierais pour ce type de séance ?</p>
                <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit, minmax(90px, 1fr))", gap:"0.5rem" }}>
                  {[
                    { v:"oui",       label:"Oui" },
                    { v:"peut-etre", label:"Peut-être" },
                    { v:"non",       label:"Non" },
                  ].map(o => (
                    <button key={o.v}
                      onClick={() => setFbPay(fbPay === o.v ? null : o.v)}
                      style={{
                        padding:"0.75rem 0.5rem", borderRadius:"12px", cursor:"pointer",
                        border:`2px solid ${fbPay === o.v ? C.gold : C.border}`,
                        background: fbPay === o.v ? "rgba(184,149,90,.12)" : C.bg,
                        color:C.cream, fontSize:"13px", transition:"all .25s",
                        fontFamily:"'Raleway',sans-serif"
                      }}>
                      {o.label}
                    </button>
                  ))}
                </div>
              </div>

              {/* Question 3 — Commentaire libre */}
              <div style={{ marginBottom:"1rem" }}>
                <p style={{ fontSize:"13px", color:C.cream, marginBottom:"0.5rem",
                  fontWeight:"500" }}>Un mot ?</p>
                <textarea
                  value={fbComment}
                  onChange={e => setFbComment(e.target.value)}
                  rows={3}
                  maxLength={500}
                  placeholder="Ce qui a marché, ce qui a manqué…"
                  style={{ width:"100%", padding:"0.875rem 1rem", background:C.bg,
                    border:`1.5px solid ${C.border}`, borderRadius:"12px",
                    fontSize:"13px", fontFamily:"'Raleway',sans-serif", color:C.cream,
                    outline:"none", resize:"vertical", lineHeight:"1.6" }} />
                <p style={{ fontSize:"10px", color:C.hint, marginTop:"4px", textAlign:"right" }}>
                  {fbComment.length}/500
                </p>
              </div>

              {fbError && (
                <div style={{ padding:"0.625rem 0.875rem", borderRadius:"10px",
                  marginBottom:"0.75rem", fontSize:"12px",
                  background:"rgba(192,57,43,.1)", border:`1px solid ${C.red}`,
                  color:"#f87171" }}>
                  ⚠ {fbError}
                </div>
              )}

              <Btn onClick={submitFeedback}
                disabled={fbSending}
                variant="primary" style={{ marginTop:"0.5rem" }}>
                {fbSending ? "Envoi…" : "Envoyer mon retour →"}
              </Btn>
              <button onClick={() => setFbSent(true)}
                style={{ display:"block", width:"100%", padding:"0.625rem",
                  background:"transparent", border:"none", color:C.hint,
                  fontSize:"11px", cursor:"pointer", marginTop:"0.5rem",
                  fontFamily:"'Raleway',sans-serif", textDecoration:"underline" }}>
                Passer sans répondre
              </button>
              <p style={{ fontSize:"10px", color:C.hint, lineHeight:"1.6",
                marginTop:"0.75rem", textAlign:"center" }}>
                100% anonyme · Aucune donnée personnelle collectée.
              </p>
            </>
          )}
        </div>

        {fbSent && (
          <Btn onClick={onRestart} variant="primary">🔄 Nouvelle séance</Btn>
        )}
        {!fbSent && (
          <p style={{ fontSize:"11px", color:C.hint, marginTop:"1rem", textAlign:"center",
            fontStyle:"italic", lineHeight:"1.6" }}>
            Réponds (ou passe) au feedback ci-dessus pour démarrer une nouvelle séance.
          </p>
        )}
      </div>
    </Card>
  );
}

function bufferToWav(buffer, sampleRate) {
  const numCh = 1, bps = 16;
  const byteRate = sampleRate * numCh * bps / 8;
  const blockAlign = numCh * bps / 8;
  const dataLen = buffer.length * blockAlign;
  const ab = new ArrayBuffer(44 + dataLen);
  const v = new DataView(ab);
  const ws = (o, s) => { for (let i=0;i<s.length;i++) v.setUint8(o+i,s.charCodeAt(i)); };
  ws(0,'RIFF'); v.setUint32(4,36+dataLen,true); ws(8,'WAVE'); ws(12,'fmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,numCh,true);
  v.setUint32(24,sampleRate,true); v.setUint32(28,byteRate,true);
  v.setUint16(32,blockAlign,true); v.setUint16(34,bps,true); ws(36,'data');
  v.setUint32(40,dataLen,true);
  const d = buffer.getChannelData(0); let o = 44;
  for (let i=0;i<d.length;i++,o+=2) { const s=Math.max(-1,Math.min(1,d[i])); v.setInt16(o,s<0?s*0x8000:s*0x7FFF,true); }
  return new Blob([ab],{type:'audio/wav'});
}

function App() {
  const [step, setStep] = useState("landing");
  const [userData, setUserData] = useState({});
  const [showMentions, setShowMentions] = useState(false);
  const [showTutorial, setShowTutorial] = useState(false);
  const [resumeData, setResumeData] = useState(null);

  const STEP_LABELS = ["Accueil","Présentation","Big Five","Sensoriel","Choix","Séance"];
  const STEP_INDEX = { landing:0, anamnese:1, bigfive:2, vakog:3, profil:4, seance:5 };

  const updateUser = (data) => setUserData(d => ({ ...d, ...data }));

  const handleLandingNext = async () => {
    if (getSessionFlag()) {
      const confirmed = window.confirm(
        "Une nouvelle séance va remplacer votre séance personnelle actuelle et remettre votre streak à zéro. Continuer ?"
      );
      if (!confirmed) return;
      await deleteSession();
      setSessionFlag(false);
      resetStreak();
    }
    setStep("anamnese");
  };

  const handleLandingResume = async () => {
    const data = await loadSession();
    if (!data || !data.audioBlob) {
      alert("Séance introuvable — elle a peut-être été effacée par votre navigateur.");
      setSessionFlag(false);
      return;
    }
    setResumeData(data);
    setStep("seance");
  };

  const handleAnamneseNext = (data) => {
    updateUser(data);
    setStep("bigfive");
  };

  const handleBigFiveNext = (bigFiveScores) => {
    updateUser({ bigFiveScores });
    setStep("vakog");
  };

  const handleVAKOGNext = (vakogResult) => {
    updateUser({ vakogResult });
    setStep("profil");
  };

  const handleProfilNext = (prefs) => {
    updateUser({ ...prefs, seanceNum: 1 });
    setStep("seance");
  };

  const handleRestart = () => {
    setStep("landing");
    setUserData({});
    setResumeData(null);
  };

  return (
    <div style={{ minHeight:"100vh", background:C.bg, display:"flex",
      flexDirection:"column", alignItems:"center", justifyContent:"center",
      padding:"clamp(1rem,3vw,2rem)" }}>

      {showMentions && <MentionsModal onClose={() => setShowMentions(false)} />}
      {showTutorial && <TutorielModal onClose={() => setShowTutorial(false)} />}

      {/* Fond décoratif */}
      <div style={{ position:"fixed", inset:0, pointerEvents:"none", overflow:"hidden", zIndex:0 }}>
        {[...Array(5)].map((_,i) => (
          <div key={i} style={{ position:"absolute",
            left:`${15+i*18}%`, top:`${10+i*15}%`,
            width:`${80+i*30}px`, height:`${80+i*30}px`,
            borderRadius:"50%", border:`1px solid rgba(184,149,90,${.04+i*.01})`,
            animation:`breathe ${4+i}s ease-in-out ${i*.5}s infinite` }} />
        ))}
      </div>

      <div style={{ position:"relative", zIndex:1, width:"100%",
        display:"flex", flexDirection:"column", alignItems:"center" }}>

        {step !== "landing" && (
          <StepIndicator
            current={STEP_INDEX[step] || 0}
            total={STEP_LABELS.length}
            labels={STEP_LABELS}
          />
        )}

        {step === "landing" && <Landing onStart={handleLandingNext} onResume={handleLandingResume} onMentions={() => setShowMentions(true)} onTutorial={() => setShowTutorial(true)} />}
        {step === "anamnese" && <Anamnese onNext={handleAnamneseNext} />}
        {step === "bigfive" && <QuizBigFive prenom={userData.prenom} onComplete={handleBigFiveNext} />}
        {step === "vakog" && <QuizVAKOG prenom={userData.prenom} onComplete={handleVAKOGNext} />}
        {step === "profil" && (
          <ProfilResult prenom={userData.prenom} bigFiveScores={userData.bigFiveScores}
            vakogResult={userData.vakogResult} problem={userData.problem} onNext={handleProfilNext} />
        )}
        {step === "seance" && (
          <SeancePlayer
            userData={resumeData ? resumeData.userData : userData}
            resumeData={resumeData}
            onRestart={handleRestart} />
        )}

        <div style={{ display:"flex", gap:"1.5rem", alignItems:"center", marginTop:"2rem",
          flexWrap:"wrap", justifyContent:"center" }}>
          <p style={{ fontSize:"10px", color:C.hint, textAlign:"center",
            fontFamily:"'Raleway', sans-serif", letterSpacing:"1px" }}>
            EUREKA Thérapie · Sophrologie · Protocole personnalisé
          </p>
          <button onClick={() => setShowMentions(true)}
            style={{ background:"transparent", border:"none", color:C.hint, fontSize:"10px",
              cursor:"pointer", fontFamily:"'Raleway',sans-serif", textDecoration:"underline",
              letterSpacing:"1px", padding:0 }}>
            Mentions légales
          </button>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
