// Le token est ensuite envoyé dans les payloads EmailJS (anamnèse, feedback, pricing).
async function getTurnstileToken() {
  const sitekey = (typeof CONFIG !== 'undefined' ? CONFIG.TURNSTILE_SITEKEY : "") || "";
  if (!sitekey) return ""; // captcha désactivé tant que la sitekey n'est pas configurée
  if (typeof window === 'undefined' || !window.turnstile) {
    console.warn("[EUREKA] Turnstile script non chargé → token vide");
    return "";
  }
  return new Promise((resolve) => {
    try {
      // Conteneur invisible pour le widget (mode "managed" → Cloudflare décide si défi visible)
      let host = document.getElementById('eureka-turnstile-host');
      if (!host) {
        host = document.createElement('div');
        host.id = 'eureka-turnstile-host';
        host.style.position = 'fixed';

        host.style.right = '10px';

        host.style.opacity = '0.01'; // invisible mais cliquable au cas où Turnstile le rend visible

        document.body.appendChild(host);

      host.innerHTML = '';

        sitekey,
        size: 'invisible',
        callback: (token) => resolve(token),
        'error-callback': () => resolve(""),
        'expired-callback': () => resolve(""),

    } catch (e) {

// ── safeFetch : fetch robuste avec timeout + retry exponentiel ────
// Évite les "Failed to fetch" silencieux en cas de hang réseau ou de 503 transitoire.
// - Timeout 45 s par tentative (AbortController)
// - Retry jusqu'à 2 fois avec backoff 1s, 3s
// - Pas de retry sur les 4xx (erreur client : la requête est mauvaise, ça ne s'arrangera pas)
// - Retry sur erreurs réseau, timeout, 5xx, 429 (rate limit)
async function safeFetch(url, options = {}, { timeoutMs = 45000, maxRetries = 2, retryDelayMs = 1000 } = {}) {
  let lastError = null;
  for (let attempt = 0; attempt <= maxRetries; attempt++) {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
    try {
      const r = await fetch(url, { ...options, signal: controller.signal });
      clearTimeout(timeoutId);
      // 4xx : ne pas retry, l'erreur est définitive (mauvais input client)
      if (r.status >= 400 && r.status < 500 && r.status !== 429) {
        return r;
      }
      // 5xx ou 429 : retry si on a encore des tentatives
      if ((r.status >= 500 || r.status === 429) && attempt < maxRetries) {
        lastError = new Error("HTTP " + r.status);
        await new Promise(res => setTimeout(res, retryDelayMs * Math.pow(3, attempt)));
        continue;
      }
      return r;
    } catch (e) {
      clearTimeout(timeoutId);
      lastError = e;
      // Timeout (AbortError) ou erreur réseau : retry si possible
      if (attempt < maxRetries) {
        await new Promise(res => setTimeout(res, retryDelayMs * Math.pow(3, attempt)));
        continue;
      }
      // Plus de tentatives possibles : on remonte l'erreur enrichie
      const reason = e.name === 'AbortError' ? 'timeout 45s' : (e.message || 'réseau');
      throw new Error("Échec après " + (maxRetries + 1) + " tentatives (" + reason + ")");
    }
  }
  throw lastError || new Error("Échec inconnu");
}

// ── Utilitaires Streak 21 jours ────────────────────────────────────
// Le streak compte les ÉCOUTES consécutives de la séance personnelle (pas les générations).
// La séance personnelle est sauvegardée et l'utilisateur l'écoute 21 jours d'affilée.
function getToday() { return new Date().toISOString().slice(0, 10); }

function loadStreak() {
  try {
    const raw = localStorage.getItem('eureka_streak');
    if (!raw) return { lastDate: null, streak: 0 };
    return JSON.parse(raw);
  } catch { return { lastDate: null, streak: 0 }; }
}

function saveStreak(data) {
  try { localStorage.setItem('eureka_streak', JSON.stringify(data)); } catch {}
}

// Incrémente le streak pour une ÉCOUTE (pas une génération).
// Un seul incrément par jour. Plus d'1 jour d'absence = reset à 1.
function incrementStreakOnPlay() {
  const today = getToday();
  const current = loadStreak();
  const { lastDate, streak } = current;
  if (lastDate === today) return current; // déjà compté aujourd'hui
  if (!lastDate) { const s = { lastDate: today, streak: 1 }; saveStreak(s); return s; }
  const yest = new Date(today); yest.setDate(yest.getDate() - 1);
  const yestStr = yest.toISOString().slice(0, 10);
  const newStreak = lastDate === yestStr ? Math.min(streak + 1, 21) : 1;
  const s = { lastDate: today, streak: newStreak };
  saveStreak(s); return s;
}

function resetStreak() {
  try { localStorage.removeItem('eureka_streak'); } catch {}
  // v26 — au reset du streak, on retire aussi le flag bilan T+21
  // pour qu'un nouveau cycle de 21 jours puisse déclencher un nouveau bilan
  try { localStorage.removeItem('eureka_bilan21_sent'); } catch {}
}

// ── IndexedDB : sauvegarde de la séance personnelle (audio + script + profil) ──
// localStorage est limité à ~5Mo : trop petit pour un audio de séance complète (5-50Mo).
// IndexedDB peut tenir 50Mo+ et persiste entre les sessions.
const IDB_NAME = 'eureka_db';
const IDB_STORE = 'sessions';

function idbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function saveSession(data) {
  // data: { audioBlob, script, userData, savedAt, voice, useV3Mode }
  try {
    const db = await idbOpen();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).put(data, 'current');
      tx.oncomplete = () => { db.close(); resolve(true); };
      tx.onerror = () => { db.close(); reject(tx.error); };
    });
  } catch (e) { console.warn('IDB save failed:', e); return false; }
}

async function loadSession() {
  try {
    const db = await idbOpen();
    return new Promise((resolve) => {
      const tx = db.transaction(IDB_STORE, 'readonly');
      const req = tx.objectStore(IDB_STORE).get('current');
      req.onsuccess = () => { db.close(); resolve(req.result || null); };
      req.onerror = () => { db.close(); resolve(null); };
    });
  } catch { return null; }
}

async function deleteSession() {
  try {
    const db = await idbOpen();
    return new Promise((resolve) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).delete('current');
      tx.oncomplete = () => { db.close(); resolve(true); };
      tx.onerror = () => { db.close(); resolve(false); };
    });
  } catch { return false; }
}

// Utilisé par le bouton « Tout effacer mes données » dans la modal Mentions Légales (section RGPD).
// Conformité RGPD article 17 (« droit à l'effacement »).
// Supprime : (1) toutes les séances IndexedDB current + historique, (2) tout localStorage EUREKA,
// (3) sessionStorage. Puis recharge la page pour repartir d'un état neutre.
async function deleteAllUserData() {
  try {
    // 1. Supprimer la séance current dans IndexedDB
    await deleteSession();
    // 2. Supprimer toutes les séances de l'historique IndexedDB
    const history = (function () {
      try { const raw = localStorage.getItem('eureka_history'); return raw ? JSON.parse(raw) : []; }
      catch { return []; }
    })();
    for (const entry of history) {
      try { await deleteSessionById(entry.id); } catch {}
    }
    // 3. Vider tout localStorage EUREKA (toutes les clés eureka_*)
    const eurekaKeys = [
      'eureka_streak', 'eureka_bilan21_sent', 'eureka_history',
      'eureka_session_meta', 'eureka_session_count', 'eureka_pricing_shown',
      'eureka_eleven_key', 'eureka_speed_player',
      'eureka_anamnese_state', 'eureka_profil_state',
      'eureka_quiz_bigfive', 'eureka_quiz_vakog',
      'eureka_last_feedback', 'eureka_last_bilan21', 'eureka_last_pricing',
      'eureka_reminder_time'
    ];
    for (const k of eurekaKeys) {
      try { localStorage.removeItem(k); } catch {}
    }
    // 4. Vider toutes les positions audio sauvegardées (clés type eureka_seance_*_position)
    try {
      const allKeys = Object.keys(localStorage);
      for (const k of allKeys) {
        if (k.startsWith('eureka_seance_') && k.endsWith('_position')) {
          localStorage.removeItem(k);
        }
      }
    } catch {}
    // 5. Vider sessionStorage
    try { sessionStorage.removeItem('eureka_last_step'); } catch {}
    return true;
  } catch (e) {
    console.warn('deleteAllUserData failed:', e);
    return false;
  }
}

// BIG FIVE — Modèle de personnalité scientifiquement validé (OCEAN)
// Inventaire BFI-10 (Rammstedt & John, 2007)
// 10 items, échelle Likert 1-5, 5 dimensions indépendantes
// Validation interculturelle ~50 pays, héritabilité 40-60%, stabilité ~0.7 sur 30 ans.
// ══════════════════════════════════════════════════════════════════
const BFI10 = [
  { dim: "E", reverse: true,  text: "Je me vois comme quelqu'un de réservé." },
  { dim: "A", reverse: false, text: "Je me vois comme quelqu'un de naturellement confiant envers les autres." },
  { dim: "C", reverse: true,  text: "Je me vois comme quelqu'un qui a tendance à être paresseux(se)." },
  { dim: "N", reverse: true,  text: "Je me vois comme quelqu'un de globalement détendu(e) au quotidien." },
  { dim: "O", reverse: true,  text: "Je me vois comme quelqu'un qui s'intéresse peu aux arts (musique, peinture, littérature, théâtre)." },
  { dim: "E", reverse: false, text: "Je me vois comme quelqu'un d'extraverti(e), de sociable." },
  { dim: "A", reverse: true,  text: "Je me vois comme quelqu'un qui critique facilement les autres." },
  { dim: "C", reverse: false, text: "Je me vois comme quelqu'un de consciencieux(se), qui fait son travail à fond." },
  { dim: "N", reverse: false, text: "Je me vois comme quelqu'un qui s'inquiète facilement, qui devient nerveux(se)." },
  { dim: "O", reverse: false, text: "Je me vois comme quelqu'un d'imaginatif(ve), qui aime créer ou explorer de nouvelles idées." },
];
const LIKERT_LABELS = [
  { v: 1, text: "Pas du tout d'accord" },
  { v: 2, text: "Plutôt pas d'accord" },
  { v: 3, text: "Neutre / sans avis" },
  { v: 4, text: "Plutôt d'accord" },
  { v: 5, text: "Tout à fait d'accord" },
];
const BIG_FIVE_NAMES = {
  O: "Ouverture", C: "Conscienciosité", E: "Extraversion",
  A: "Agréabilité", N: "Névrosisme"
};
const BIG_FIVE_DESC = {
  O: "Ouverture aux idées, métaphores, abstractions et nouvelles expériences",
  C: "Préférence pour la structure, la discipline, les protocoles précis",
  E: "Énergie tirée du monde extérieur (vs introspection)",
  A: "Tendance à la confiance, à la coopération, à la chaleur relationnelle",
  N: "Sensibilité émotionnelle, tendance à l'anxiété, besoin de validation"
};
function scoreBigFive(answers) {
  const dims = { O: [], C: [], E: [], A: [], N: [] };
  BFI10.forEach((q, i) => {
    const raw = answers[i];
    if (raw == null) return;
    const score = q.reverse ? (6 - raw) : raw;
    dims[q.dim].push(score);
  });
  const result = {};
  for (const k of ["O","C","E","A","N"]) {
    if (dims[k].length === 0) { result[k] = 50; continue; }
    const avg = dims[k].reduce((s,v) => s+v, 0) / dims[k].length;
    result[k] = Math.round(((avg - 1) / 4) * 100);
  }
  return result;
}
function bigFiveLevel(score) {
  if (score >= 70) return "Élevé";
  if (score >= 55) return "Moyen-haut";
  if (score >= 45) return "Moyen";
  if (score >= 30) return "Moyen-bas";
  return "Bas";
}

function StreakBanner({ streak }) {

  const msg = streak === 0
    ? "Générez votre première séance pour commencer"
    : streak === 1 ? "Excellent début ! Revenez demain pour maintenir votre progression ✨"
    : streak < 7  ? `🔥 Vous êtes à ${streak} jours consécutifs — vous êtes lancé(e) !`
    : streak < 14 ? `🔥 ${streak} jours — votre cerveau se reconfigure profondément !`
    : streak < 21 ? `🔥 ${streak} jours — vous approchez de la transformation complète !`
    : "";

  if (isDone) return (
    <div style={{ background:`linear-gradient(135deg,rgba(184,149,90,.2),rgba(42,138,143,.2))`,
      borderRadius:"16px", padding:"1.25rem 1.5rem", border:`1.5px solid ${C.gold}`,

      <p style={{ fontSize:"12px", color:C.muted, marginTop:"0.5rem", lineHeight:"1.6" }}>
        La transformation est intégrée. Continuez à pratiquer pour maintenir les bénéfices.
      </p>
    </div>
  );

  return (
    <div style={{ background:C.card, borderRadius:"16px", padding:"1rem 1.25rem",
      border:`1px solid ${C.border}`, marginBottom:"1.25rem", animation:"fadeUp .5s ease" }}>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:"0.6rem" }}>
        <p style={{ fontSize:"13px", color:C.cream, fontFamily:"'Raleway',sans-serif", flex:1, paddingRight:"1rem", lineHeight:"1.5" }}>
          {msg}

function ReminderPanel() {
  const [permStatus, setPermStatus] = useState(
    typeof Notification !== 'undefined' ? Notification.permission : 'unsupported'
  );
  const [reminderTime, setReminderTime] = useState(() => {
    try { return localStorage.getItem('eureka_reminder_time') || '20:00'; } catch { return '20:00'; }
  });
  const [saved, setSaved] = useState(false);
  const [showFallback] = useState(() => {
    const { lastDate } = loadStreak();
    return lastDate !== getToday();
  });

  const requestPermission = async () => {
    if (typeof Notification === 'undefined') return;
    const p = await Notification.requestPermission();
    setPermStatus(p);
    if (p === 'granted') {
      new Notification("EUREKA Sophrologie 🌿", {
        body: "Prenez 5 minutes pour votre séance aujourd'hui 🌿",
        icon: "/favicon.ico"
      });
    }
  };

  const saveTime = () => {
    try { localStorage.setItem('eureka_reminder_time', reminderTime); } catch {}
    setSaved(true);
    setTimeout(() => setSaved(false), 2000);
  };

  return (
    <div style={{ background:C.card, borderRadius:"16px", padding:"1.25rem 1.5rem",
      border:`1px solid ${C.border}`, marginBottom:"1.5rem" }}>
      <h3 style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:"18px", color:C.cream,
        fontWeight:"400", marginBottom:"1rem" }}>🔔 Rappels quotidiens</h3>

      {showFallback && (
        <div style={{ background:"rgba(184,149,90,.1)", borderRadius:"10px",
          padding:"0.75rem 1rem", border:`1px solid ${C.gold}`, marginBottom:"1rem" }}>
          <p style={{ fontSize:"13px", color:C.goldLight, lineHeight:"1.6" }}>
            🌿 N'oubliez pas votre séance aujourd'hui
          </p>
        </div>
      )}

      <div style={{ display:"flex", gap:"0.75rem", alignItems:"center", marginBottom:"1rem", flexWrap:"wrap" }}>
        <label style={{ fontSize:"12px", color:C.muted, fontFamily:"'Raleway',sans-serif" }}>Heure préférée :</label>
        <input type="time" value={reminderTime} onChange={e => setReminderTime(e.target.value)}
          style={{ padding:"6px 10px", background:C.panel, border:`1px solid ${C.border}`,
            borderRadius:"8px", color:C.cream, fontSize:"13px", fontFamily:"'Raleway',sans-serif" }} />
        <button onClick={saveTime}
          style={{ padding:"6px 14px", background:C.tealDark, border:"none", borderRadius:"8px",
            color:C.cream, fontSize:"12px", cursor:"pointer", fontFamily:"'Raleway',sans-serif" }}>
          {saved ? "✓ Enregistré" : "Enregistrer"}
        </button>
      </div>

      {permStatus === 'unsupported'
        ? <p style={{ fontSize:"12px", color:C.muted }}>Notifications non disponibles sur ce navigateur.</p>
        : permStatus === 'granted'
          ? <p style={{ fontSize:"12px", color:"#4ade80" }}>✓ Notifications activées — rappel à {reminderTime}</p>
          : permStatus === 'denied'
            ? <p style={{ fontSize:"12px", color:C.muted }}>Notifications bloquées. Autorisez-les dans les paramètres de votre navigateur.</p>
            : (
              <button onClick={requestPermission}
                style={{ width:"100%", padding:"0.75rem",
                  background:`linear-gradient(135deg,${C.teal},${C.tealDark})`,
                  border:"none", borderRadius:"10px", color:C.cream, fontSize:"13px",
                  cursor:"pointer", fontFamily:"'Raleway',sans-serif", letterSpacing:"1px" }}>
                🔔 Activer les rappels
              </button>
            )
      }
    </div>
  );
}

// ─── SpeedSlider — slider de vitesse de lecture audio (0.70 → 1.25)
// Default 1.00 = vitesse de l'audio tel que généré (peu importe le speed TTS interne).
// Mapping direct sliderValue → audio.playbackRate (le navigateur préserve le pitch).
// Persistence localStorage pour que le client retrouve sa préférence.
// Utilisé sur : (1) DemoAudio (preview voix landing) — (2) player principal page résultat.
// Vitesses par défaut par voix — ajustées pour le rythme sophro (Silva pure delivers v3 audio at speed ~1.0,
// donc on ralentit côté player pour atteindre la vitesse cible). Le client peut toujours ajuster via le slider.
const VOICE_PLAYBACK_DEFAULTS = {
  "4RZ84U1b4WCqpu57LvIq": 0.85, // Bella
  "YV28ox2c5Cuh5rim0LrW": 0.85, // Marcel
  "19cV422MaCP4oU6N8AFm": 0.90, // Mickaël (réenregistré)
  "cQVn2FWawJsxa2z9X3l1": 0.90, // Valentin (whisper)
};

// Nombre d'ellipses entre les chiffres du compte respiratoire selon la voix choisie.
// Calibré pour une cadence finale ~1s/temps après application du speed slider :
//   Bella/Marcel @ 0.85× : 2 dots = 0.82s/temps
//   Mickaël/Valentin @ 0.90× : 3 dots = 1.11s/temps
// Cadence sophro Caycedo ~1s/temps (Caycedo, Schultz). Confort respiratoire optimisé.
const VOICE_DOTS_COUNT = {
  "4RZ84U1b4WCqpu57LvIq": 2, // Bella
  "YV28ox2c5Cuh5rim0LrW": 2, // Marcel
  "19cV422MaCP4oU6N8AFm": 3, // Mickaël
  "cQVn2FWawJsxa2z9X3l1": 3, // Valentin
};

function SpeedSlider({ audioRef, storageKey = "eureka_speed_player", defaultRate = 1.00 }) {
  const [speed, setSpeed] = useState(() => {
    try {
      const saved = parseFloat(localStorage.getItem(storageKey));
      return (saved >= 0.70 && saved <= 1.25) ? saved : defaultRate;
    } catch { return defaultRate; }
  });
  // Réapplique playbackRate à chaque fois que l'audio (re-)charge ou que speed change
  useEffect(() => {
    if (audioRef && audioRef.current) audioRef.current.playbackRate = speed;
  }, [speed, audioRef]);
  // Applique aussi quand l'audio commence à jouer (au cas où l'audio est rechargé entre temps)
  useEffect(() => {
    const a = audioRef && audioRef.current;
    if (!a) return;
    const onPlay = () => { a.playbackRate = speed; };
    a.addEventListener("play", onPlay);
    return () => a.removeEventListener("play", onPlay);
  }, [speed, audioRef]);
  const onChange = (v) => {
    setSpeed(v);
    try { localStorage.setItem(storageKey, String(v)); } catch {}
    if (audioRef && audioRef.current) audioRef.current.playbackRate = v;
  };
  const isCustom = Math.abs(speed - defaultRate) > 0.005;
  return (
    <div style={{ marginTop:"0.75rem", display:"flex", alignItems:"center", gap:"0.75rem" }}
      title="Ajustez la vitesse de lecture sans changer la voix. ×1.00 = vitesse normale.">
      <span style={{ fontSize:"10px", color:C.muted, letterSpacing:"1.5px",
        textTransform:"uppercase", minWidth:"55px", fontWeight:"600" }}>
        Vitesse
      </span>
      <input type="range" min="0.70" max="1.25" step="0.01" value={speed}
        onChange={(e) => onChange(parseFloat(e.target.value))}
        style={{ flex:1, accentColor:C.gold, cursor:"pointer" }} />
      <span style={{ fontSize:"11px", color: isCustom ? C.gold : C.muted,
        fontFamily:"monospace", minWidth:"42px", textAlign:"right",
        fontStyle: isCustom ? "italic" : "normal", fontWeight: isCustom ? "600" : "400" }}>
        ×{speed.toFixed(2)}
      </span>
      {isCustom && (
        <button onClick={() => onChange(defaultRate)} title="Réinitialiser à la vitesse recommandée"
          style={{ background:"transparent", border:`1px solid ${C.border}`,
            color:C.muted, cursor:"pointer", fontSize:"12px", padding:"2px 6px",
            borderRadius:"4px", lineHeight:"1" }}>
          ↺
        </button>
      )}
    </div>
  );
}

// ─── Mini-démo audio — un court échantillon vocal jouable avant inscription
// L'audio est généré à la demande via /api/tts puis caché en mémoire (URL.createObjectURL).
// Match strict des réglages séance (eleven_v3 + voice_settings) pour ne pas tromper l'utilisateur.
// Conversion attendue : x2-3 d'engagement quand l'utilisateur entend la voix avant de cliquer "Commencer".
function DemoAudio() {
  const [state, setState] = useState("idle");      // idle | loading | playing | paused | error
  const [progress, setProgress] = useState(0);     // 0-100
  const [duration, setDuration] = useState(0);     // secondes
  const audioRef = useRef(null);
  const cachedUrlRef = useRef(null);

  // ─── PLUS DE GÉNÉRATION DYNAMIQUE — on charge un MP3 statique depuis Vercel Blob ───
  // La phrase enregistrée dans preview_mickael.mp3 est :
  //   "Bonjour. Voici ma voix. Je peux vous accompagner pour votre séance."
  // (générée via generateur_demo_mickael_mbti_v3_PREVIEW.html en mode v3 avec les
  //  réglages validés Mickaël : Stab 0.75 / Style 0.20 / Boost ON / Speed 0.90)
  // Si tu changes la phrase, regénère le MP3 et uploade-le sur Blob avec le même nom.

  const play = async () => {
    // Toggle pause/play si déjà chargé
    if (cachedUrlRef.current && audioRef.current) {
      if (state === "playing") {
        audioRef.current.pause();
        setState("paused");
        return;
      }
      if (state === "paused") {
        audioRef.current.play();
        setState("playing");
        return;
      }
    }
    // Première lecture : on charge un MP3 STATIQUE pré-généré sur Vercel Blob
    // (au lieu de générer dynamiquement à chaque visiteur — coût zéro côté serveur,
    // qualité identique, instantané). Le fichier preview_mickael.mp3 doit être
    // uploadé sur Blob via le générateur preview (cf. generateurs_demo/*_v3_PREVIEW.html).
    setState("loading");
    track("demo_audio_play");
    try {
      // BÊTA : on désactive le cache navigateur pour TOUJOURS récupérer la dernière
      // version du MP3 sur Blob (au cas où on le remplace pendant le développement).
      // Coût : ~80 Ko re-téléchargés à chaque visite — négligeable. Quand le site
      // sera stable, on pourra retirer { cache: 'no-store' } pour réactiver le cache
      // et économiser la bande passante.
      const blobUrl = "https://hnuokd1cvass8ly7.public.blob.vercel-storage.com/preview_mickael.mp3";
      const r = await safeFetch(blobUrl, { cache: 'no-store' }, { timeoutMs: 15000, maxRetries: 1 });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const blob = await r.blob();
      const url = URL.createObjectURL(blob);
      cachedUrlRef.current = url;
      if (audioRef.current) {
        audioRef.current.src = url;
        await audioRef.current.play();
        setState("playing");
        track("demo_audio_loaded");
      }
    } catch(e) {
      console.error("[DEMO] Erreur génération audio:", e);
      setState("error");
      setTimeout(() => setState("idle"), 3000);
    }
  };

  const onTimeUpdate = () => {
    if (!audioRef.current) return;
    const d = audioRef.current.duration || 0;
    const t = audioRef.current.currentTime || 0;
    if (d > 0) setProgress((t / d) * 100);
    if (d && d !== duration) setDuration(d);
  };

  const onEnded = () => {
    setState("idle");
    setProgress(0);
    track("demo_audio_completed");
  };

  const label = ({
    idle: "▶  Écouter un aperçu d'une des voix",
    loading: "⏳  Génération en cours...",
    playing: "⏸  Pause",
    paused: "▶  Reprendre",
    error: "✕  Erreur — réessayez"
  })[state];

  return (
    <div style={{ background:`linear-gradient(135deg, rgba(184,149,90,.10), rgba(42,138,143,.05))`,
      borderRadius:"16px", padding:"1.25rem 1.25rem 1rem", border:`1.5px solid ${C.gold}`,
      marginBottom:"1.5rem" }}>
      <p style={{ fontSize:"11px", color:C.gold, letterSpacing:"2px", textTransform:"uppercase",
        fontWeight:"600", marginBottom:"0.5rem", textAlign:"center" }}>
        🎧 Aperçu d'une des voix
      </p>
      <p style={{ fontSize:"12px", color:C.muted, lineHeight:"1.6", textAlign:"center",
        marginBottom:"1rem", fontStyle:"italic" }}>
        Un court échantillon pour entendre le timbre.
      </p>
      <audio ref={audioRef} onTimeUpdate={onTimeUpdate} onEnded={onEnded} style={{ display:"none" }} />
      <button onClick={play} disabled={state === "loading"}
        style={{ display:"block", width:"100%", padding:"0.875rem",
          background: state === "error" ? "rgba(192,57,43,.15)" :
                      state === "playing" || state === "paused" ? `linear-gradient(135deg, ${C.teal}, ${C.tealDark})` :
                      "transparent",
          color: state === "error" ? "#f87171" : state === "playing" || state === "paused" ? C.cream : C.gold,
          border: state === "playing" || state === "paused" ? "none" : `1.5px solid ${C.gold}`,
          borderRadius:"10px", fontSize:"12px", fontFamily:"'Raleway',sans-serif", fontWeight:"600",
          letterSpacing:"2px", textTransform:"uppercase",
          cursor: state === "loading" ? "wait" : "pointer",
          opacity: state === "loading" ? 0.7 : 1,
          transition:"all .2s" }}>
        {label}
      </button>
      {(state === "playing" || state === "paused") && (
        <div style={{ marginTop:"0.75rem", height:"4px", background:C.bg, borderRadius:"2px",
          overflow:"hidden" }}>
          <div style={{ height:"100%", width:`${progress}%`,
            background:`linear-gradient(90deg, ${C.gold}, ${C.teal})`,
            transition:"width .15s linear" }} />
        </div>
      )}
      {/* Slider de vitesse — visible quand l'audio est prêt (pas en idle ni loading) */}
      {(state === "playing" || state === "paused") && (
        <SpeedSlider audioRef={audioRef} storageKey="eureka_speed_player" defaultRate={0.90} />
      )}
    </div>
  );
}

// ─── ÉCRAN HISTORIQUE — liste de toutes les séances passées avec lecture + téléchargement + suppression
// Lecture : on charge le blob depuis IndexedDB à la demande (sinon trop lourd à monter en mémoire d'un coup).
function MesSeances({ onBack, onResume }) {
  const [history, setHistoryState] = useState(() => getHistory());
  const [playingId, setPlayingId] = useState(null);
  const [loadingId, setLoadingId] = useState(null);
  const audioRef = useRef(null);

  useEffect(() => { track("history_view", { count: history.length }); }, []);

  const fmt = (iso) => {
    try {
      const d = new Date(iso);
      return d.toLocaleDateString("fr-FR", { day:"2-digit", month:"long", year:"numeric" }) +
        " · " + d.toLocaleTimeString("fr-FR", { hour:"2-digit", minute:"2-digit" });
    } catch { return iso; }
  };

  const togglePlay = async (id) => {
    if (playingId === id) {
      audioRef.current?.pause();
      setPlayingId(null);
      return;
    }
    setLoadingId(id);
    const data = await loadSessionById(id);
    setLoadingId(null);
    if (!data || !data.audioBlob) {
      alert("Audio introuvable pour cette séance — il a peut-être été effacé par le navigateur.");
      removeHistoryEntry(id);
      setHistoryState(getHistory());
      return;
    }
    const url = URL.createObjectURL(data.audioBlob);
    if (audioRef.current) {
      audioRef.current.pause();
      audioRef.current.src = url;
      audioRef.current.play();
      setPlayingId(id);
      track("history_play", { id: String(id) });
    }
  };

  const downloadAudio = async (entry) => {
    setLoadingId(entry.id);
    const data = await loadSessionById(entry.id);
    setLoadingId(null);
    if (!data || !data.audioBlob) { alert("Audio introuvable."); return; }
    const url = URL.createObjectURL(data.audioBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `eureka_${entry.prenom || 'seance'}_${(entry.archetypeName || '').replace(/\s+/g, '_')}_${new Date(entry.savedAt).toISOString().slice(0,10)}.mp3`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    track("history_download", { id: String(entry.id) });
  };

  const reuse = async (entry) => {
    setLoadingId(entry.id);
    const data = await loadSessionById(entry.id);
    setLoadingId(null);
    if (!data) { alert("Séance introuvable."); return; }
    track("history_resume", { id: String(entry.id) });
    onResume(data);
  };

  const remove = (id) => {
    if (!window.confirm("Supprimer définitivement cette séance ? L'audio et le script seront effacés.")) return;
    removeHistoryEntry(id);
    deleteSessionById(id);
    setHistoryState(getHistory());
    if (playingId === id) {
      audioRef.current?.pause();
      setPlayingId(null);
    }
    track("history_delete", { id: String(id) });
  };

  return (
    <Card style={{ maxWidth:"680px" }}>
      <Logo small />
      <audio ref={audioRef} onEnded={() => setPlayingId(null)} style={{ display:"none" }} />

      <div style={{ borderTop:`2px solid ${C.gold}`, paddingTop:"1.5rem" }}>
        <h2 style={{ fontFamily:"'Cormorant Garamond', serif", fontSize:"28px", color:C.cream,
          fontWeight:"400", marginBottom:"0.5rem", textAlign:"center" }}>
          Mes séances
        </h2>
        <p style={{ fontSize:"13px", color:C.muted, lineHeight:"1.7", textAlign:"center",
          marginBottom:"1.5rem", fontStyle:"italic" }}>
          {history.length === 0
            ? "Vous n'avez pas encore de séance enregistrée."
            : `${history.length} séance${history.length > 1 ? 's' : ''} enregistrée${history.length > 1 ? 's' : ''} · stockées localement sur votre appareil`}
        </p>

        {history.length === 0 && (
          <div style={{ background:C.panel, borderRadius:"12px", padding:"2rem 1.5rem",
            border:`1px solid ${C.border}`, textAlign:"center", marginBottom:"1.5rem" }}>
            <div style={{ fontSize:"40px", marginBottom:"0.75rem", opacity:0.4 }}>📂</div>
            <p style={{ fontSize:"13px", color:C.muted, lineHeight:"1.6" }}>
              Vos séances générées apparaîtront ici. Vous pourrez les réécouter, les télécharger ou les supprimer à tout moment.
            </p>
          </div>
        )}

        {history.map((entry, idx) => {
          const isPlaying = playingId === entry.id;
          const isLoading = loadingId === entry.id;
          return (
            <div key={entry.id} style={{ background:isPlaying ? `linear-gradient(135deg, rgba(42,138,143,.15), rgba(184,149,90,.10))` : C.panel,
              borderRadius:"14px", padding:"1.25rem", border:isPlaying ? `1.5px solid ${C.teal}` : `1px solid ${C.border}`,
              marginBottom:"1rem", transition:"all .2s" }}>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start",
                gap:"1rem", marginBottom:"0.75rem", flexWrap:"wrap" }}>
                <div style={{ flex:1, minWidth:"200px" }}>
                  <p style={{ fontSize:"11px", color: entry.couple ? C.teal : C.gold, letterSpacing:"1.5px",
                    textTransform:"uppercase", fontWeight:"600", marginBottom:"0.25rem" }}>
                    {entry.couple ? "🌿 Séance à deux n°" : "Séance n°"}{history.length - idx}
                  </p>
                  <p style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:"20px", color:C.cream,
                    lineHeight:"1.3", marginBottom:"0.25rem" }}>
                    {entry.couple
                      ? ((entry.person1Prenom || "?") + " & " + (entry.person2Prenom || "?"))
                      : (entry.archetypeName || "Profil")}
                  </p>
                  <p style={{ fontSize:"11px", color:C.muted }}>
                    {fmt(entry.savedAt)}
                  </p>
                  {entry.problem && (
                    <p style={{ fontSize:"12px", color:C.muted, marginTop:"0.5rem", lineHeight:"1.5",
                      fontStyle:"italic", maxHeight:"3rem", overflow:"hidden",
                      display:"-webkit-box", WebkitLineClamp:2, WebkitBoxOrient:"vertical" }}>
                      « {entry.problem.length > 90 ? entry.problem.slice(0, 90) + "…" : entry.problem} »
                    </p>
                  )}
                </div>
                {entry.useV3Mode && (
                  <span style={{ fontSize:"10px", padding:"0.25rem 0.5rem", background:"rgba(42,138,143,.20)",
                    border:`1px solid ${C.teal}`, borderRadius:"6px", color:C.teal,
                    letterSpacing:"1px", fontWeight:"600", whiteSpace:"nowrap" }}>
                    EXPRESSIF
                  </span>
                )}
              </div>

              <div style={{ display:"flex", gap:"0.5rem", flexWrap:"wrap" }}>
                <button onClick={() => togglePlay(entry.id)} disabled={isLoading}
                  style={{ flex:"1 1 110px", padding:"0.625rem",
                    background: isPlaying ? `linear-gradient(135deg, ${C.teal}, ${C.tealDark})` : "transparent",
                    color: isPlaying ? C.cream : C.gold,
                    border: isPlaying ? "none" : `1.5px solid ${C.gold}`,
                    borderRadius:"8px", fontSize:"11px", fontFamily:"'Raleway',sans-serif",
                    fontWeight:"600", letterSpacing:"1.5px", textTransform:"uppercase",
                    cursor: isLoading ? "wait" : "pointer", opacity: isLoading ? 0.6 : 1 }}>
                  {isLoading ? "⏳" : isPlaying ? "⏸ Pause" : "▶ Écouter"}
                </button>
                <button onClick={() => downloadAudio(entry)} disabled={isLoading}
                  style={{ flex:"1 1 110px", padding:"0.625rem", background:"transparent",
                    color:C.muted, border:`1px solid ${C.border}`, borderRadius:"8px",
                    fontSize:"11px", fontFamily:"'Raleway',sans-serif", fontWeight:"600",
                    letterSpacing:"1.5px", textTransform:"uppercase", cursor:"pointer" }}>

// ÉTAPE 1 : Anamnèse
// ─── DÉTECTEUR DE CRISE PSYCHOLOGIQUE ──────────────────────────────
// Regex côté client pour détecter une idéation suicidaire ou auto-mutilation.
// Si match → écran de redirection vers 3114 (numéro national gratuit 24/7).
// Faux positifs possibles → l'utilisateur peut confirmer explicitement et continuer.
const CRISIS_PATTERNS = [
  // Idéation suicidaire directe
  /\b(je veux|j['ae]\s*envie|envie\s*de)\s*(mourir|en\s*finir|disparaître|disparaitre|me tuer|me suicider)\b/i,
  /\b(suicid|me\s*suicider|me\s*tuer|me\s*pendre|me\s*jeter|me\s*tirer\s*une\s*balle)\b/i,
  /\b(en\s*finir\s*avec|en\s*finir\s*tout|tout\s*arr[êe]ter|j'en\s*peux\s*plus|j'arr[êe]te\s*tout)\b/i,
  /\b(plus\s*envie\s*de\s*(vivre|continuer)|envie\s*de\s*plus\s*(vivre|exister))\b/i,
  /\b(?:j['ae]\s*pense\s*[àa]|pens[eé]e?s?\s*de)\s*(suicid|me\s*tuer|en\s*finir|mort)/i,
  // Auto-mutilation
  /\b(me\s*(faire|fais)\s*(du\s*)?mal|m'automutil|me\s*scarif|me\s*coup[ae]r)\b/i,
  /\b(scarif|automutil)/i,
  // Dernière volonté / planning
  /\b(adieu|derni[èe]re\s*lettre|testament|plan\s*pour\s*en\s*finir)\b/i,
];
function detectCrisis(text) {
  if (!text) return false;
  return CRISIS_PATTERNS.some(rx => rx.test(text));
}

// ─── Détection de SENSIBILITÉ ÉMOTIONNELLE (plus permissif que detectCrisis) ───
// Sert à activer la version DOUCE de la scène thérapeutique sur les cycles 1-2
// pour les profils fragiles (anxiété chronique, deuil, post-traumatique, etc.).
// NE déclenche PAS l'écran d'urgence (réservé à detectCrisis = cas graves).
// Logique Variante 2 : cycles 1-2 douce (sécurité), cycles 3-7 standard (intensification).
const SENSIBILITY_PATTERNS = [
  /anxi[ée]t[ée]/i, /panique/i, /phobie/i, /traumati(?:s|qu)/i, /deuil/i,
  /PTSD/i, /angoisse/i, /burn.?out/i, /d[ée]pression/i, /attaque/i,
  /[ée]puis(?:é|ée|ement)/i, /effondre/i, /\b[ée]motions? (?:fortes|intenses)\b/i,
  /crise/i, /stress chronique/i, /fragile/i,
];
function detectSensibility(text) {
  if (!text) return false;
  return SENSIBILITY_PATTERNS.some(rx => rx.test(text));
}

// ─── DÉTECTEUR D'OBJECTIF NUISIBLE — INTENT GUARD (SAFE) ───────────
// Mesure de sûreté déontologique : EUREKA ne génère pas de séance affirmant
// un objectif qui vise à nuire à autrui (manipulation, vengeance, domination)
// ou à s'infliger du mal (auto-punition, isolement forcé, anhédonie volontaire).
// Distinct de detectCrisis (qui couvre l'idéation suicidaire et redirige vers 3114).
//
// Conçu pour MINIMISER les faux positifs sur les reformulations bienveillantes :
//   « je veux ne plus me détester » → bénin, NE match PAS
//   « apprendre à cesser de me punir » → bénin, NE match PAS
//   « surmonter une humiliation passée » → bénin (humiliation = nom, pas verbe)
// Mécanisme : on neutralise d'abord les segments « ne plus/pas X », « cesser de X »,
// « arrêter de X », puis on cherche les patterns malveillants dans le texte normalisé.
function detectMaliciousIntent(text) {
  if (!text) return false;
  const orig = text.toLowerCase();

  // Phase 1 — patterns d'auto-destruction qui CONTIENNENT « ne plus » (l'objectif
  // lui-même est préoccupant, pas une reformulation). Hors champ de detectCrisis.
  const negativeIntent = [
    /\bne\s+plus\s+rien\s+(ressentir|sentir|[ée]prouver)\b/i,
    /\bne\s+plus\s+(voir|parler\s+[àa])\s+(personne|qui\s+que\s+ce\s+soit)\b/i,
  ];
  if (negativeIntent.some(rx => rx.test(orig))) return true;

  // Phase 2 — neutralisation des négations bénignes
  const t = orig
    .replace(/\bne\s+plus\s+(?:[a-zà-ÿ']+\s+){0,3}/gi, ' XXNEG ')
    .replace(/\bne\s+pas\s+(?:[a-zà-ÿ']+\s+){0,3}/gi, ' XXNEG ')
    .replace(/\bcesser\s+de\s+(?:[a-zà-ÿ']+\s+){0,2}/gi, ' XXNEG ')
    .replace(/\barr[êe]ter\s+de\s+(?:[a-zà-ÿ']+\s+){0,2}/gi, ' XXNEG ');

  // Phase 3 — patterns d'intention malveillante (envers autrui ou auto-destruction
  // sub-clinique) dans le texte normalisé
  const malicious = [
    // Envers autrui
    /\bme\s+venger\b/i,
    /\bfaire\s+souffrir\b/i,
    /\bpousser\s+[àa]\s+bout\b/i,
    /\bprendre\s+l['']ascendant\s+sur\b/i,
    /\bdominer\s+(mon|ma|sa|son|mes|ses|cette?|quelqu|les?\s+gens)/i,
    /\bmanipuler\s+(mon|ma|sa|son|mes|ses|cette?|quelqu|les?\s+gens)/i,
    /\bhumilier\b/i,
    /\b[ée]craser\s+(mon|ma|sa|son|mes|ses|cette?|quelqu)/i,
    /\b(leur|lui|le|la|les)\s+faire\s+payer\b/i,
    /\bfaire\s+payer\s+[àa]\s+(mon|ma|sa|son|mes|ses|cette?|cet)/i,
    /\bnuire\s+[àa]\s/i,
    /\bd[eé]truire\s+(mon|ma|sa|son|mes|ses|cette?|quelqu|sa\s+vie|leur\s+vie|leur\s+couple|le\s+couple|la\s+vie\s+de|ta\s+vie)/i,
    // Auto-destruction sub-clinique (après neutralisation des « ne plus / ne pas »)
    /\bme\s+punir\b/i,
    /\bme\s+d[ée]tester\b/i,
    /\bme\s+ha[ïi]r\b/i,
    /\bme\s+rabaisser\b/i,
    /\bm['']isoler\b/i,
  ];

  return malicious.some(rx => rx.test(t));
}

function Anamnese({ onNext, personId }) {
  // ─── Sauvegarde anti-frustration : on restaure depuis localStorage si présent
  // Les textareas sont longues à remplir, perdre tout au refresh = abandon garanti.
  // v_couple : la clé est paramétrée selon personId (1 ou 2) pour permettre à P1 et P2
  // de remplir leur anamnèse sans collision. Mode solo (personId undefined) = clé classique.
  const ANAMNESE_KEY = personId ? `eureka_anamnese_p${personId}_state` : 'eureka_anamnese_state';
  const loadSaved = () => {
    try {
      const raw = localStorage.getItem(ANAMNESE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch { return null; }
  };
  const saved = loadSaved();
  const [email, setEmail] = useState(saved?.email || "");
  const [emailTouched, setET] = useState(saved?.emailTouched || false);
  const [prenom, setPrenom] = useState(saved?.prenom || "");
  const [problem, setProblem] = useState(saved?.problem || "");
  const [objectif, setObjectif] = useState(saved?.objectif || "");
  const [consentement, setConsentement] = useState(saved?.consentement || false);
  const [hasSupport, setHasSupport] = useState(saved?.hasSupport ?? null); // null=non répondu, false=non, true=oui

  // ─── État détecteur de crise ───────────────────────────────────────
  const [crisisDetected, setCrisisDetected] = useState(false);  // vrai = écran de redirection affiché
  const [crisisOverride, setCrisisOverride] = useState(false);  // vrai = utilisateur confirme et continue malgré tout

  // ─── État détecteur d'objectif nuisible (intent guard SAFE) ────────
  // Pas d'override : la regex est conçue pour ne pas faux-positifer.
  // Si match → écran de reformulation, l'utilisateur doit modifier son objectif.
  const [maliciousDetected, setMaliciousDetected] = useState(false);

  // ─── Onboarding doux (option C) — 6 mini-écrans plutôt qu'un mur de formulaire
  // Chaque écran présente UN champ unique, validation par étape, navigation Retour/Suivant.
  // Détection de crise déclenchée dès la sortie des écrans 2 (problème) et 3 (objectif),
  // pour ne pas faire perdre 3 écrans à un visiteur en détresse.
  const TOTAL_SCREENS = 6;
  // v27 fix : on demarre TOUJOURS a l'ecran 0 (prenom) meme si saved.screen existe.
  // Cela permet a l'utilisateur de voir/modifier ses donnees pre-remplies plutot que
  // d'arriver direct sur le dernier ecran de consentement.
  const [screen, setScreen] = useState(0);

  // Persiste à chaque modification d'un champ (debounce naturel via React batching)
  useEffect(() => {
    try {
      localStorage.setItem(ANAMNESE_KEY, JSON.stringify({
        email, emailTouched, prenom, problem, objectif, consentement, hasSupport, screen
      }));
    } catch {}
  }, [email, emailTouched, prenom, problem, objectif, consentement, hasSupport, screen]);

  const emailErr = emailTouched && !isValidEmail(email);

  // Validation par écran : le bouton Suivant n'est actif que si le champ courant est valide.
  const screenValid = [
    prenom.trim().length > 0,        // 0 — prénom
    isValidEmail(email),             // 1 — email
    problem.trim().length > 15,      // 2 — problème
    objectif.trim().length > 10,     // 3 — objectif
    hasSupport !== null,             // 4 — suivi pro
    consentement,                    // 5 — consentement RGPD
  ];

  const goBack = () => { if (screen > 0) setScreen(screen - 1); };

  const goNext = () => {
    // Détection de crise dès la sortie des écrans sensibles
    if (screen === 2 && detectCrisis(problem) && !crisisOverride) {
      track("crisis_detected", {
        field: "problem",
        has_support: hasSupport === true ? "yes" : (hasSupport === false ? "no" : "unknown")
      });
      setCrisisDetected(true);
      return;
    }
    if (screen === 3 && detectCrisis(objectif) && !crisisOverride) {
      track("crisis_detected", {
        field: "objectif",
        has_support: hasSupport === true ? "yes" : (hasSupport === false ? "no" : "unknown")
      });
      setCrisisDetected(true);
      return;
    }
    // SAFE — Intent guard : détection d'objectif nuisible (envers autrui ou auto-destruction)
    // Priorité APRÈS detectCrisis (qui prime sur la redirection 3114) mais AVANT l'avance d'écran.
    if (screen === 2 && detectMaliciousIntent(problem)) {
      track("malicious_intent_detected", { field: "problem" });
      setMaliciousDetected(true);
      return;
    }
    if (screen === 3 && detectMaliciousIntent(objectif)) {
      track("malicious_intent_detected", { field: "objectif" });
      setMaliciousDetected(true);
      return;
    }
    // Avance d'un écran (sauf le dernier où on submit)
    if (screen < TOTAL_SCREENS - 1) {
      setScreen(screen + 1);
      return;
    }
    // Submit final — defense in depth : re-check crisis au cas où
    if ((detectCrisis(problem) || detectCrisis(objectif)) && !crisisOverride) {
      track("crisis_detected", {
        field: detectCrisis(problem) ? "problem" : "objectif",
        has_support: hasSupport === true ? "yes" : "no"
      });
      setCrisisDetected(true);
      return;
    }
    // SAFE — defense in depth pour l'intent guard
    if (detectMaliciousIntent(problem) || detectMaliciousIntent(objectif)) {
      track("malicious_intent_detected", {

// ÉTAPE 2 : Quiz Big Five
function QuizBigFive({ prenom, onComplete, personId }) {
  // v_couple : clé paramétrée selon personId (mode solo si undefined)
  const BIGFIVE_KEY = personId ? `eureka_quiz_bigfive_p${personId}` : 'eureka_quiz_bigfive';
  const [current, setCurrent] = useState(() => {
    try {
      const saved = localStorage.getItem(BIGFIVE_KEY);
      const c = saved ? (JSON.parse(saved).current || 0) : 0;
      // Safety : si current pointe hors du tableau (quiz precedemment termine, current=10),
      // on revient a 0 pour eviter BFI10[10].text qui crashe l'app (ecran noir).
      // Les reponses restent chargees dans answers, donc l'utilisateur retrouve ses choix.
      return c >= BFI10.length ? 0 : c;
    } catch { return 0; }
  });
  const [answers, setAnswers] = useState(() => {
    try {
      const saved = localStorage.getItem(BIGFIVE_KEY);
      return saved ? (JSON.parse(saved).answers || {}) : {};
    } catch { return {}; }
  });
  const pct = Math.round((current / BFI10.length) * 100);

  const persist = (cur, ans) => {
    try { localStorage.setItem(BIGFIVE_KEY, JSON.stringify({ current: cur, answers: ans })); } catch {}
  };

  const handleAnswer = (likertValue) => {
    const newAns = { ...answers, [current]: likertValue };
    setAnswers(newAns);
    if (current < BFI10.length - 1) {
      const newCur = current + 1;
      setCurrent(newCur);
      persist(newCur, newAns);
    } else {
      // v27 fix : on GARDE les reponses pour permettre l'auto-skip aux prochaines visites (utile en test + visiteurs reguliers)
      try { localStorage.setItem(BIGFIVE_KEY, JSON.stringify({ current: BFI10.length, answers: newAns, completed: true })); } catch {}
      const scores = scoreBigFive(newAns);
      onComplete(scores);
    }

    <Card>
      <Logo small />

          <span style={{ fontSize:"12px", color:C.muted }}>{current+1} / {BFI10.length}</span>
        </div>

        <div style={{ height:"3px", background:C.border, borderRadius:"2px", marginBottom:"1.5rem", overflow:"hidden" }}>

            width:`${pct}%`, transition:"width .4s ease", borderRadius:"2px" }} />
        </div>

        <h2 style={{ fontFamily:"'Cormorant Garamond', serif", fontSize:"22px", color:C.cream,
          fontWeight:"400", lineHeight:"1.4", marginBottom:"0.5rem" }}>
          {prenom && <span style={{ color:C.goldLight }}>{prenom}, </span>}{q.text}
        </h2>
        <p style={{ fontSize:"12px", color:C.muted, marginBottom:"1.5rem", fontStyle:"italic" }}>

        <div style={{ display:"grid", gap:"0.5rem" }}>

                  flexShrink:0 }}>{opt.v}</span>
                {opt.text}
              </button>
            );
          })}
        </div>

        {current > 0 && (
          <button className="back-btn" onClick={() => {
              const newCur = current - 1;

              persist(newCur, answers);
            }}

function ProfilResult({ prenom, bigFiveScores, vakogResult, problem, onNext }) {
  // ─── Sauvegarde anti-frustration : on restaure les choix utilisateur si refresh
  const PROFIL_KEY = 'eureka_profil_state';
  const loadSaved = () => {
    try {
      const raw = localStorage.getItem(PROFIL_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch { return null; }
  };
  const saved = loadSaved();
  const [relaxDir, setRelaxDir] = useState(saved?.relaxDir || "");
  const [beliefSystem, setBeliefSystem] = useState(saved?.beliefSystem || "");
  const [musicChoice, setMusicChoice] = useState(saved?.musicChoice || "");
  // v26bis — selectedVoice retiré de ProfilResult (consigne Mickaël 2026-05-08).
  // Le choix de voix se fait maintenant APRÈS la séance dans VoiceSelection.
  // Persiste à chaque changement de choix
  useEffect(() => {
    try {
      localStorage.setItem(PROFIL_KEY, JSON.stringify({
        relaxDir, beliefSystem, musicChoice
      }));
    } catch {}
  }, [relaxDir, beliefSystem, musicChoice]);

  const vakog = vakogResult.dominant;
  // Archétype dérivé des scores Big Five (Pèlerin / Bâtisseur / Compagnon / Voyageur)
  const archetypeKey = archetypeFromBigFive(bigFiveScores);
  const archetype = ARCHETYPES[archetypeKey];
  // Direction de relaxation dérivée du Big Five
  const isIntrovertBF = bigFiveScores ? bigFiveScores.E < 50 : false;
  const isIntuitive = bigFiveScores ? bigFiveScores.O > 55 : false;
  const isIntrovert = isIntrovertBF; // pour compat avec le code existant

  // Recommandation auto de la direction de relaxation

        </p>
        {(() => {
          const combinedProblem = ((person1?.problem || "") + " " + (person2?.problem || "")).toLowerCase();
          let recMusic = "binaural"; // défaut

          else if (/fatigue|épuis|déprim|dépression|tristesse|mélanc|énergie|burn/.test(combinedProblem)) recMusic = "relaxation";

            <p style={{ fontSize:"12px", color:C.goldLight, marginBottom:"1rem", fontStyle:"italic" }}>

        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"0.6rem" }}>
          {(() => {

            let recMusic = "binaural";

            else if (/deuil|perte|solitude|abandon|seul|rupture|manque|vide|chagrin/.test(combinedProblem)) recMusic = "coeur";
            else if (/ancr|dispers|perdu|focus|concentr|flott|instable/.test(combinedProblem)) recMusic = "tambour";

// ─── EmergencyExitButton — bouton flottant 🌅 « Sortir doucement » (v26)
// Affiché en permanence pendant la séance (fixed top-right). Au clic :
//   1. Met en pause l'audio principal de la séance
//   2. Joue la "sortie douce" pré-enregistrée (~45s par voix, depuis Vercel Blob)
//   3. À la fin de la sortie douce, affiche un modal rassurant + bouton retour accueil
// Pas de modal de choix au clic — la personne en fragilité ne doit PAS être confrontée à un choix.
// La pause normale (sans sortie) reste possible via les controls natifs HTML5 du player audio.
function EmergencyExitButton({ audioRef, selectedVoice, onExit }) {
  const [exiting, setExiting] = useState(false);
  const [showFinalModal, setShowFinalModal] = useState(false);
  const sortieAudioRef = useRef(null);

  // Mapping voix réelle → nom du fichier MP3 sortie douce sur Vercel Blob
  const SORTIE_DOUCE_VOICE_NAMES = {
    "4RZ84U1b4WCqpu57LvIq": "bella",
    "YV28ox2c5Cuh5rim0LrW": "marcel",
    "cQVn2FWawJsxa2z9X3l1": "valentin",
    "19cV422MaCP4oU6N8AFm": "mickael"
  };
  const SORTIE_DOUCE_BASE_URL = "https://hnuokd1cvass8ly7.public.blob.vercel-storage.com/sortie_douce_";

  // PRÉCHARGEMENT — dès que le composant est monté (= séance générée), on télécharge
  // le MP3 sortie douce en arrière-plan. Au clic du bouton, l'audio sera déjà bufferisé
  // et démarrera instantanément (au lieu d'attendre 2-5 sec de fetch réseau).
  useEffect(() => {
    if (sortieAudioRef.current && selectedVoice) {
      const voiceName = SORTIE_DOUCE_VOICE_NAMES[selectedVoice] || "mickael";
      const url = SORTIE_DOUCE_BASE_URL + voiceName + ".mp3";
      try {
        sortieAudioRef.current.src = url;
        sortieAudioRef.current.preload = "auto";
        sortieAudioRef.current.load();
        console.log("[EUREKA] Sortie douce préchargée :", voiceName);
      } catch (e) { console.warn("Préchargement sortie douce échoué:", e); }
    }
  }, [selectedVoice]);

  const handleEmergencyExit = () => {
    if (exiting) return;
    setExiting(true);
    track("emergency_exit_clicked", { voice: SORTIE_DOUCE_VOICE_NAMES[selectedVoice] || "unknown" });
    // 1. Coupure RENFORCÉE de l'audio principal (pause + mute en backup)
    try {
      if (audioRef && audioRef.current) {
        audioRef.current.pause();
        audioRef.current.muted = true; // backup au cas où pause() ne propage pas immédiatement
      }
    } catch (e) { console.warn("Erreur coupure audio principal:", e); }
    // 2. Joue la sortie douce (déjà préchargée, démarrage instantané)
    if (sortieAudioRef.current) {
      // src est déjà set par le préchargement, mais on s'assure qu'il l'est
      if (!sortieAudioRef.current.src) {
        const voiceName = SORTIE_DOUCE_VOICE_NAMES[selectedVoice] || "mickael";
        sortieAudioRef.current.src = SORTIE_DOUCE_BASE_URL + voiceName + ".mp3";
      }
      sortieAudioRef.current.currentTime = 0;
      sortieAudioRef.current.play().catch(e => {
        console.error("Erreur lecture sortie douce:", e);
        // Fallback : si la lecture échoue → afficher direct le modal final
        setShowFinalModal(true);
      });
    } else {
      setShowFinalModal(true);
    }
  };

  const handleSortieDouceEnded = () => {
    setShowFinalModal(true);
  };

  const handleReturnHome = () => {
    setShowFinalModal(false);
    setExiting(false);
    if (sortieAudioRef.current) {
      try {
        sortieAudioRef.current.pause();
        sortieAudioRef.current.removeAttribute("src");
        sortieAudioRef.current.load();
      } catch (e) { /* ignore */ }
    }
    if (onExit) onExit();
  };

  return (
    <>
      {/* Bouton flottant top-right — 288px (= 3× la version initiale 96px).
          Cible : extrêmement facile à toucher au pouce sur mobile en cas de crise, sans précision requise.
          Sécurité : min() avec 80vmin évite que le bouton dépasse 80% du plus petit côté de l'écran. */}
      <button onClick={handleEmergencyExit} disabled={exiting}
        title="Sortir doucement de la séance"
        aria-label="Sortir doucement de la séance"
        style={{
          position: "fixed",
          top: "1rem",
          right: "1rem",
          width: "min(288px, 80vmin)",
          height: "min(288px, 80vmin)",
          borderRadius: "50%",
          border: `4px solid ${C.gold}`,
          background: exiting ? "rgba(184,149,90,.40)" : "rgba(8,25,26,0.95)",
          backdropFilter: "blur(8px)",
          WebkitBackdropFilter: "blur(8px)",
          color: C.gold,
                cursor: exiting ? "default" : "pointer",
                opacity: exiting ? 0.5 : 1.0,
                transition: "transform .15s",
                zIndex: 1000,
                padding: 0,
                display: "flex",
                flexDirection: "column",
                alignItems: "center",
               justifyContent: "center",
               fontFamily: "'Raleway', sans-serif",
               animation: exiting ? "none" : "eurekaHalo 4s ease-in-out infinite",
              boxShadow: "0 12px 36px rgba(0,0,0,0.5)"
            }}
        onMouseEnter={(e) => {
          if (exiting) return;
          e.currentTarget.style.transform = "scale(1.03)";
          e.currentTarget.style.boxShadow = "0 16px 48px rgba(0,0,0,0.6), 0 0 0 6px rgba(184,149,90,0.30)";
        }}
        onMouseLeave={(e) => {
          if (exiting) return;
          e.currentTarget.style.transform = "scale(1)";
          e.currentTarget.style.boxShadow = "0 12px 36px rgba(0,0,0,0.5), 0 0 0 0 rgba(184,149,90,0.0)";
       }}>
        <span style={{ fontSize: "min(96px, 26vmin)", lineHeight: 1, marginBottom: "min(10px, 1.5vmin)" }}>🌅</span>
        <span style={{ fontSize: "min(20px, 5vmin)", fontWeight: 600, letterSpacing: "1.5px", textAlign: "center", lineHeight: 1.2, textTransform: "uppercase" }}>Sortir</span>
        <span style={{ fontSize: "min(20px, 5vmin)", fontWeight: 600, letterSpacing: "1.5px", textAlign: "center", lineHeight: 1.2, textTransform: "uppercase" }}>Doucement</span>
      </button>

      {/* Audio caché pour la sortie douce — préchargé au mount */}
      <audio ref={sortieAudioRef} preload="auto" onEnded={handleSortieDouceEnded} style={{ display: "none" }} />

      {/* Overlay plein écran pendant la sortie douce — apparaît IMMÉDIATEMENT au clic
          (avant que la voix démarre) pour rassurer le client : il voit que l'action a bien démarré. */}
      {exiting && !showFinalModal && (
        <div style={{
          position: "fixed", inset: 0,
          background: "rgba(8,25,26,0.96)",
          backdropFilter: "blur(12px)",
          WebkitBackdropFilter: "blur(12px)",
          zIndex: 1500,
          display: "flex", alignItems: "center", justifyContent: "center",
          flexDirection: "column",
          padding: "2rem",
          animation: "fadeUp .4s ease"
        }}>
          <div style={{ fontSize: "120px", marginBottom: "1.5rem", lineHeight: 1 }}>🌅</div>
          <h2 style={{
            fontFamily: "'Cormorant Garamond', serif",
            fontSize: "32px", color: C.cream, fontWeight: 300,
            letterSpacing: "2px", marginBottom: "1.25rem", textAlign: "center"
          }}>
            Sortie progressive
          </h2>
          <p style={{
            fontSize: "14px", color: C.muted, lineHeight: 1.7,
            maxWidth: "320px", textAlign: "center"
          }}>
            Restez assis(e), prenez votre temps.<br/>
            La voix vous accompagne vers le retour…
          </p>
        </div>
      )}

      {/* Modal final "Vous êtes en sécurité" */}
      {showFinalModal && (
        <div style={{
          position: "fixed", inset: 0,
          background: "rgba(8,25,26,0.92)",
          backdropFilter: "blur(8px)",
          WebkitBackdropFilter: "blur(8px)",
          zIndex: 2000,
          display: "flex", alignItems: "center", justifyContent: "center",
          padding: "1.5rem"
        }}>
          <div style={{
            background: C.panel,
            border: `1.5px solid ${C.gold}`,
            borderRadius: "20px",
            padding: "2.5rem 2rem",
            maxWidth: "480px",
            width: "100%",
            textAlign: "center",
            boxShadow: "0 20px 60px rgba(0,0,0,0.5)"
          }}>
            <div style={{ fontSize: "48px", marginBottom: "1rem" }}>🌅</div>
            <h2 style={{
              fontFamily: "'Cormorant Garamond', serif",
              fontSize: "26px", color: C.cream, fontWeight: 400,
              marginBottom: "1rem"
            }}>
              Vous êtes en sécurité.
            </h2>
            <p style={{
              fontSize: "14px", color: C.muted, lineHeight: 1.7,
              marginBottom: "1.75rem"
            }}>
              Votre séance est suspendue, mais le travail intérieur continue à son rythme.
              Prenez un moment pour vous, buvez un verre d'eau si vous le souhaitez,
              et revenez quand vous serez prêt(e).
            </p>
            <button onClick={handleReturnHome}
              style={{
                background: `linear-gradient(135deg, ${C.gold}, #9a7a40)`,
                color: "#1a0e00",
                border: "none",
                borderRadius: "10px",
                padding: "0.875rem 2rem",
                fontFamily: "'Raleway', sans-serif",
                fontSize: "12px",
                fontWeight: 600,
                letterSpacing: "2px",
                textTransform: "uppercase",
                cursor: "pointer"
              }}>
              Retour à l'accueil
            </button>
          </div>
        </div>
      )}
    </>
  );
}

// v27 — MantraCard : bonus offert apres la seance.
// Affiche les paroles + bouton "Telecharger les paroles" (.txt complet avec
// style Udio + instructions mobile + astuce enregistreur d'ecran).
function MantraCard({ mantra, prenom }) {
  // v30 — état pour la génération automatique via udioapi.pro (bouton « Tenter ma chance »)
  const [udioState, setUdioState] = useState({ status: "idle", workId: null, audioUrl: null, msg: "" });
  const udioPollingRef = useRef(false);

  // Clé localStorage par prénom pour reprendre un polling si l'utilisateur revient sur la séance
  const UDIO_STORAGE_KEY = "eureka_mantra_udio_" + (prenom || "anon");

  // v30 — restauration au montage : si audioUrl déjà connu pour ce prénom, on l'affiche tout de suite ;
  // si workId connu mais pas encore d'audioUrl, on relance le polling.
  useEffect(() => {
    if (!mantra) return;
    try {
      const raw = localStorage.getItem(UDIO_STORAGE_KEY);
      if (!raw) return;
      const saved = JSON.parse(raw);
      // v32 fix : si la sauvegarde n'a pas de lyrics OU si les lyrics ont changé, l'audio est obsolète
      const _currentLyrics = mantra && mantra.affirmation ? mantra.affirmation : "";
      if (saved && _currentLyrics && (!saved.lyrics || saved.lyrics !== _currentLyrics)) {
        try { localStorage.removeItem(UDIO_STORAGE_KEY); } catch (e2) {}
        console.log("[EUREKA] Audio Udio obsolète détecté (paroles différentes ou ancien format), reset");
        return;
      }
      if (saved && saved.audioUrl) {
        setUdioState({ status: "success", workId: saved.workId || null, audioUrl: saved.audioUrl, msg: "" });
      } else if (saved && saved.workId && !udioPollingRef.current) {
        setUdioState({ status: "generating", workId: saved.workId, audioUrl: null, msg: "Reprise de la génération en cours..." });
        pollUdio(saved.workId);
      }
    } catch (e) { /* ignore */ }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [mantra]);

  // v30 — polling /api/udio?action=feed&workId=xxx jusqu'à audio_url ou timeout 12×10s
  const pollUdio = async (workId) => {
    if (udioPollingRef.current) return;
    udioPollingRef.current = true;
    const MAX_TRIES = 12;
    const INTERVAL_MS = 10000;
    for (let i = 0; i < MAX_TRIES; i++) {
      try {
        const r = await fetch("/api/udio?action=feed&workId=" + encodeURIComponent(workId));
        const j = await r.json();
        const items = (j && j.data && Array.isArray(j.data.response_data)) ? j.data.response_data : [];
        // Échec content moderation / quota : on coupe immédiatement
        const failItem = items.find(it => it && it.fail_message);
        if (failItem) {
          udioPollingRef.current = false;
          setUdioState({ status: "error", workId, audioUrl: null, msg: "Quota épuisé pour aujourd'hui — reviens demain pour tenter à nouveau." });
          try { localStorage.removeItem(UDIO_STORAGE_KEY); } catch (e) {}
          return;
        }
        // Succès : on prend le premier audio_url non vide (premier segment ou le complet)
        const okItem = items.find(it => it && it.audio_url && it.audio_url.length > 0);
        if (okItem && okItem.audio_url) {
          udioPollingRef.current = false;
          setUdioState({ status: "success", workId, audioUrl: okItem.audio_url, msg: "" });
          try { localStorage.setItem(UDIO_STORAGE_KEY, JSON.stringify({ workId, audioUrl: okItem.audio_url, lyrics: (mantra && mantra.affirmation ? mantra.affirmation : "") })); } catch (e) {}
          return;
        }
      } catch (e) { /* on continue le polling, ça peut être un blip réseau */ }
      await new Promise(resolve => setTimeout(resolve, INTERVAL_MS));
    }
    // Timeout 2 min sans audio_url
    udioPollingRef.current = false;
    setUdioState({ status: "error", workId, audioUrl: null, msg: "Délai dépassé — réessaye un peu plus tard." });
  };

  // v30 — bouton « Tenter ma chance » : appelle /api/udio?action=generate puis poll
  const tenterMaChance = async () => {
    if (udioPollingRef.current) return;
    setUdioState({ status: "generating", workId: null, audioUrl: null, msg: "Envoi de la génération à Udio..." });
    try {
      const udioBlock = mantra && mantra.udio ? mantra.udio : {};
      const lyrics = (mantra.affirmation || "") + "\n" + (mantra.affirmation || "") + "\n\n" +
        (mantra.vakog1 || "") + "\n" + (mantra.vakog2 || "") + "\n" + (mantra.vakog3 || "") + "\n\n" +
        (mantra.affirmation || "") + "\n" + (mantra.affirmation || "") + "\n\n" +
        (mantra.sceau || "");
      const styleStr = (udioBlock.style || "ambient sacré minimal") + ", " + (udioBlock.tempo_bpm || 60) + " bpm";
      const titleStr = "Mantra " + (prenom || "");
      const r = await fetch("/api/udio?action=generate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "chirp-v4-5",
          prompt: lyrics,
          style: styleStr,
          title: titleStr,
          make_instrumental: false
        })
      });
      const j = await r.json();
      const workId = (j && j.workId) || (j && j.data && j.data.task_id) || null;
      if (!r.ok || !workId) {
        const errMsg = (j && j.message) || (j && j.error) || ("HTTP " + r.status);
        setUdioState({ status: "error", workId: null, audioUrl: null, msg: "Quota épuisé pour aujourd'hui — reviens demain pour tenter à nouveau. (" + errMsg + ")" });
        return;
      }
      try { localStorage.setItem(UDIO_STORAGE_KEY, JSON.stringify({ workId, audioUrl: null, lyrics: (mantra && mantra.affirmation ? mantra.affirmation : "") })); } catch (e) {}
      setUdioState({ status: "generating", workId, audioUrl: null, msg: "Génération en cours... (~1 à 2 min)" });
      pollUdio(workId);
    } catch (e) {
      setUdioState({ status: "error", workId: null, audioUrl: null, msg: "Erreur réseau — réessaye dans un instant." });
    }
  };

  if (!mantra) return null;

  const paroles = mantra.affirmation + "\n" + mantra.affirmation + "\n\n" +
    mantra.vakog1 + "\n" + mantra.vakog2 + "\n" + mantra.vakog3 + "\n\n" +
    mantra.affirmation + "\n" + mantra.affirmation + "\n\n" +
    mantra.sceau;

  const udio = mantra.udio || {};

  const downloadMantra = () => {
    const dateStr = new Date().toLocaleDateString('fr-FR');
    const sep = "=======================================";
    const contenu =
      sep + "\n" +
      "BONUS — TON MANTRA PERSONNALISÉ\n" +
      prenom + " — créé le " + dateStr + "\n" +
      sep + "\n\n" +
      sep + "\n" +
      "PAROLES À COLLER DANS UDIO :\n" +
      sep + "\n\n" +
      paroles + "\n\n" +
      sep + "\n" +
      "STYLE MUSICAL À COLLER DANS UDIO :\n" +
      sep + "\n" +
      (udio.style || "ambient sacre minimal") + "\n\n" +
      "PARAMÈTRES RECOMMANDÉS :\n" +
      "- Tempo : " + (udio.tempo_bpm || 60) + " bpm\n" +
      "- Durée cible : " + (udio.duration_target || "2:30") + "\n" +
      "- Voix : " + (udio.vocal || "voix posée") + "\n" +
      "- Instruments : " + (udio.instruments || "piano, ambient pad") + "\n" +
      "- Ambiance : " + (udio.mood || "méditatif sacré") + "\n\n" +
      sep + "\n" +
      "COMMENT CRÉER TON CHANT SUR UDIO (MOBILE, FRANÇAIS) :\n" +
      sep + "\n" +
      "1. Ouvre udio.com sur ton téléphone\n" +
      "2. Connecte-toi (Google, Apple, ou email)\n" +
      "3. Appuie sur 'Commencez à créer'\n" +
      "4. Dans 'Décrivez votre chanson' (en haut), COLLE le STYLE.\n" +
      "5. Plus bas, appuie sur 'Écrivez vos paroles'.\n" +
      "6. Choisis le mode 'Coutume' (pas 'Auto' ni 'Instrumental').\n" +
      "7. Dans le grand champ texte, COLLE les PAROLES.\n" +
      "8. Tout en bas, appuie sur 'Créer'.\n" +
      "9. Patiente 1-2 minutes. La chanson apparaît dans ta Bibliothèque.\n\n" +
      sep + "\n" +
      "COMMENT ÉCOUTER TON CHANT (RITUEL 21 JOURS) :\n" +
      sep + "\n" +
      "ATTENTION : le téléchargement Udio est PAYANT.\n" +
      "Mais l'écoute en ligne est gratuite et illimitée.\n\n" +

function SeancePlayer({ userData, resumeData, onRestart }) {

      const r = await fetch(blobUrl, { cache: 'no-store' });

        const blob = await r.blob();

  // ─── STREAK : incrémenter sur l'écoute (>30s) de la séance personnelle ────
  // On ne déclenche qu'UNE fois par session, et seulement si l'audio est personnalisé.
  const streakCountedRef = useRef(false);
  const handleAudioPlay = () => {
    setIsPlaying(true);
  };
  // ─── PERSISTANCE POSITION ÉCOUTE (v26 — consigne Mickaël) ─────────
  // Sauvegarde la position d'écoute toutes les 5 sec en localStorage, avec timestamp.
  // Au rechargement de l'audio (resume séance), si la pause < 1h → reprise au point arrêt -5s.
  // Si pause > 1h → séance recommencée depuis le début (clear localStorage).
  // Clé par seanceNum pour ne pas confondre les séances entre elles.
  const POSITION_KEY = `eureka_seance_${seanceNum}_position`;
  const lastPositionSaveRef = useRef(0);

  const handleAudioTimeUpdate = (e) => {
    setProgress(e.target.currentTime);
    // Streak : seulement après 30s d'écoute, et seulement sur audio personnalisé
    if (!streakCountedRef.current && fullGenPhase === "done" && e.target.currentTime >= 30) {
      streakCountedRef.current = true;
      const newStreak = incrementStreakOnPlay();
      // v26 — re-render pour déclencher la bascule en mode bilan si streak passe à 21
      setCurrentStreakLevel(newStreak.streak);
      console.log("[EUREKA] Streak incrémenté :", newStreak.streak, "/ 21 jours");
      track("audio_played_30s", { streak: newStreak.streak, model: lastModelUsed || "?" });
    }
    // Persistance position (throttle 5s, ne sauve qu'au-delà de 5 sec d'écoute)
    // v26 fix : ne sauver QUE pour la séance complète (pas pour l'échantillon),
    // sinon la position de l'échantillon polluait la séance complète au chargement.
    const isFullSeance = isResume || fullGenPhase === "done";
    const now = Date.now();
    if (isFullSeance && now - lastPositionSaveRef.current > 5000 && e.target.currentTime > 5) {
      lastPositionSaveRef.current = now;
      try {
        localStorage.setItem(POSITION_KEY, JSON.stringify({
          time: e.target.currentTime,
          timestamp: now
        }));
      } catch (err) { /* ignore quota errors */ }
    }
  };

  // Restauration position au chargement de l'audio (resume séance)
  // v26 fix : ne restaurer QUE pour la séance complète. Sur l'échantillon, toujours démarrer à 0.
  // (avant ce fix, la position échantillon polluait la séance complète au moment du switch d'audio)
  const handleAudioLoadedMetadata = (e) => {
    setDuration(e.target.duration);
    const isFullSeance = isResume || fullGenPhase === "done";

      // Échantillon : forcer démarrage à 0 et ne rien lire en localStorage
      try { e.target.currentTime = 0; } catch (err) { /* ignore */ }
      return;
    }
    try {
      const raw = localStorage.getItem(POSITION_KEY);
      if (!raw) return;
      const saved = JSON.parse(raw);
      if (!saved || !saved.time || !saved.timestamp) return;
      const elapsed = Date.now() - saved.timestamp;
      const ONE_HOUR_MS = 60 * 60 * 1000;

    } catch (err) { /* ignore */ }
