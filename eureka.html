        "cQVn2FWawJsxa2z9X3l1": { stability:0.85, similarity_boost:0.70, style:0.05, use_speaker_boost:false, speed:0.90 }, // Valentin
        "19cV422MaCP4oU6N8AFm": { stability:0.70, similarity_boost:0.75, style:0.25, use_speaker_boost:true,  speed:0.95 }, // Mickaël v2 — niveau 2 : stab 0.82→0.70 + style 0.10→0.25 + boost ON pour rendre la voix moins plate. Speed 1.00→0.95 (légère décélération).
      };
      const VOICE_SETTINGS_V3 = {
        "19cV422MaCP4oU6N8AFm": { stability:0.75, similarity_boost:0.80, style:0.20, use_speaker_boost:true,  speed:0.90 }, // Mickaël v3
        "YV28ox2c5Cuh5rim0LrW": { stability:0.65, similarity_boost:0.70, style:0.30, use_speaker_boost:true,  speed:0.85 }, // Marcel v3   (validé)
        "4RZ84U1b4WCqpu57LvIq": { stability:0.55, similarity_boost:0.75, style:0.35, use_speaker_boost:true,  speed:0.78 }, // Bella v3    (validée)
        "cQVn2FWawJsxa2z9X3l1": { stability:0.88, similarity_boost:0.60, style:0.10, use_speaker_boost:false, speed:0.90 }, // Valentin v3 (validé) — whisper, similarity basse pour réduire sibilance
      };
      // ─── Vitesse WSOLA appliquée APRÈS génération v3 (pitch préservé) ─────
      // ⚠ WSOLA NEUTRALISÉ (toutes voix à 1.00) suite au bug "zzz" sur sessions longues.
      // L'algo inline se verrouille en boucle sur certaines séquences répétitives
      // (ex: "je vous" qui revient souvent en sophro). À réactiver quand on aura un
      // vrai algo de time-stretch (SoundTouch / Rubber Band) ou un fix anti-verrouillage.
      // 1.00 = aucun WSOLA (audio natif conservé tel quel).
      const VOICE_WSOLA_SPEED = {
        "4RZ84U1b4WCqpu57LvIq": 1.00, // Bella    — désactivé (bug WSOLA)
        "YV28ox2c5Cuh5rim0LrW": 1.00, // Marcel   — désactivé (bug WSOLA)
        "19cV422MaCP4oU6N8AFm": 1.00, // Mickaël  — désactivé (bug WSOLA)
        "cQVn2FWawJsxa2z9X3l1": 1.00, // Valentin — désactivé (bug WSOLA)
      };

      // Décide du modèle effectif :
      // - useV3Mode actif → eleven_v3 (toggle disponible pour TOUTES les voix
      //   maintenant — l'admin/utilisateur peut tester n'importe quelle voix en v3)
      // - sinon → eleven_multilingual_v2 (et on supprime les balises v3 du texte sinon elles seraient lues)
      const useV3 = useV3Mode;
      const effectiveModelId = useV3 ? "eleven_v3" : "eleven_multilingual_v2";
      const baseSettings = useV3
        ? (VOICE_SETTINGS_V3[selectedVoice] || VOICE_SETTINGS_V2[selectedVoice])
        : (VOICE_SETTINGS_V2[selectedVoice] || VOICE_SETTINGS_V2["4RZ84U1b4WCqpu57LvIq"]);
      // Si l'utilisateur a ouvert le panneau avancé, on utilise SES paramètres
      const effectiveSettings = showAdvanced ? {
        stability: advStability,
        similarity_boost: advSimilarity,
        style: advStyle,
        use_speaker_boost: advUseSpeakerBoost,
        speed: advSpeed
      } : baseSettings;
      // Mémorise le modèle réellement utilisé pour l'affichage post-génération
      setLastModelUsed(effectiveModelId);
      // Limite caractères par modèle : v3 = 3000 max → marge à 2800. v2 = 5000 max → marge à 4800.
      const MAX_TTS_CHARS = useV3 ? 2800 : 4800;
      const MAX_CTX_CHARS = useV3 ? 800 : 1000;

      const ttsClient = async (txt, prevText = "", nextText = "") => {
        if (!txt.trim()) return null;
        // Strip pauses systématiquement, et balises v3 si on n'est pas en v3 (sinon elles seraient lues littéralement)
        const stripV3 = (t) => useV3 ? t : t.replace(V3_TAG_REGEX, "");
        // ─── Workaround phonétique : ElevenLabs v2 a un bug de rendu sur certaines cédilles
        // (lit "perçois" comme "perkoi" au lieu de "persoi"). On remplace ç → s avant envoi.
        // Le script reste lisible en français propre côté affichage utilisateur.
        // Phonétiquement équivalent : "ç" et "s" produisent tous deux le son /s/.
        const fixCedille = (t) => t.replace(/ç/g, 's').replace(/Ç/g, 'S');
        const cleanCtx = (t) => fixCedille(stripV3(t.replace(/\[PAUSE_[\d.]+s\]/gi, ""))).trim().substring(0, MAX_CTX_CHARS);
        const body = {
          text: fixCedille(stripV3(txt.replace(/\[PAUSE_[\d.]+s\]/gi, ""))).trim().substring(0, MAX_TTS_CHARS),
          model_id: effectiveModelId,
          voice_settings: effectiveSettings
        };
        // IMPORTANT : eleven_v3 (alpha) ne supporte PAS encore previous_text/next_text.
        if (!useV3) {
          if (prevText) body.previous_text = cleanCtx(prevText);
          if (nextText) body.next_text = cleanCtx(nextText);
        }
        let r;
        try {
          // safeFetch : timeout 60s + retry 1x (ElevenLabs peut être lent en v3)
          r = await safeFetch("/api/tts", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ key: key, voiceId: selectedVoice, ...body })
          }, { timeoutMs: 60000, maxRetries: 1 });
        } catch (netErr) {
          throw new Error("Erreur réseau ElevenLabs (" + netErr.message + "). Modèle utilisé : " + effectiveModelId + ". Si v3 actif, vérifier que ta voix supporte v3 et que ton plan a accès au modèle v3.");
        }
        if (!r.ok) {
          let detail = "";
          try {
            const errBody = await r.text();
            const errJson = JSON.parse(errBody);
            detail = errJson?.detail?.message || errJson?.detail || errBody.substring(0, 200);
          } catch {
            detail = "(corps de réponse illisible)";
          }
          throw new Error("ElevenLabs " + r.status + " sur " + effectiveModelId + " — " + detail);
        }
        return await actx.decodeAudioData(await r.arrayBuffer());
      };

      // ─── Normalisation par segment (volume uniforme à 0.92 peak) ───
      const normalizeBuffer = (buf) => {
        const ch = buf.getChannelData(0);
        let peak = 0;
        for (let i = 0; i < ch.length; i++) {
          if (Math.abs(ch[i]) > peak) peak = Math.abs(ch[i]);
        }
        if (peak > 0.0001) {
          const gain = 0.92 / peak;
          for (let i = 0; i < ch.length; i++) ch[i] *= gain;
        }
      };

      // ─── Fade-in/Fade-out 10ms anti-clic de jonction ───
      const applyFade = (buf) => {
        const ch = buf.getChannelData(0);
        const fadeSamples = Math.min(Math.floor(sr * 0.03), Math.floor(ch.length / 4));  // 30ms (au lieu de 10ms) — atténue clicks et bruits sourds aux jonctions PAUSE_3s/5s/15s
        for (let i = 0; i < fadeSamples; i++) {
          ch[i] *= i / fadeSamples;
          ch[ch.length - 1 - i] *= i / fadeSamples;
        }
      };

      // ─── Parser : ne découper qu'aux pauses longues (>= 2s) ───
      // Les pauses courtes (0.5s, 1s) restent dans le même appel TTS
      const SPLIT_THRESHOLD = 2.0;
      const pat = /\[PAUSE_([\d.]+)s\]/gi;
      const rawParts = [];
      let li = 0, mx;
      while ((mx = pat.exec(activeScript)) !== null) {
        const t = activeScript.slice(li, mx.index).trim();
        if (t) rawParts.push({ type:"t", c:t });
        rawParts.push({ type:"s", sec:parseFloat(mx[1]) });
        li = mx.index + mx[0].length;
      }
      const rem = activeScript.slice(li).trim();
      if (rem) rawParts.push({ type:"t", c:rem });
      // Fusionner les textes séparés par des pauses courtes
      const parts = [];
      let mi = 0;
      while (mi < rawParts.length) {
        if (rawParts[mi].type === "t") {
          let merged = rawParts[mi].c;
          let mj = mi + 1;
          while (mj < rawParts.length) {
            if (rawParts[mj].type === "s" && rawParts[mj].sec < SPLIT_THRESHOLD) {
              if (mj + 1 < rawParts.length && rawParts[mj+1].type === "t") {
                merged += " " + rawParts[mj+1].c;
                mj += 2;
              } else { break; }
            } else { break; }
          }
          parts.push({ type:"t", c:merged });
          while (mj < rawParts.length && rawParts[mj].type === "s") {
            parts.push(rawParts[mj]);
            mj++;
          }
          mi = mj;
        } else {
          parts.push(rawParts[mi]);
          mi++;
        }
      }
      // Découpage des segments en respectant la limite du modèle (v3=2800, v2=4800)
      const fp = [];
      for (const p of parts) {
        if (p.type === "s") { fp.push(p); continue; }
        let tx = p.c;
        while (tx.length > MAX_TTS_CHARS) {
          let cut = tx.lastIndexOf("... ", MAX_TTS_CHARS);
          if (cut < 500) cut = tx.lastIndexOf(". ", MAX_TTS_CHARS);
          if (cut < 500) cut = MAX_TTS_CHARS;
          fp.push({ type:"t", c:tx.substring(0, cut+3) });
          tx = tx.substring(cut+3).trim();
        }
        if (tx) fp.push({ type:"t", c:tx });
      }
      const tc = fp.filter(p => p.type === "t").length;
      let done = 0;
      const allText = fp.filter(p => p.type === "t");
      for (const p of fp) {
        if (p.type === "s") { bufs.push(sil(p.sec)); continue; }
        done++;
        setFullGenMsg("Audio " + done + " / " + tc + " segments...");
        // Contexte vocal : segment précédent et suivant pour cohérence ElevenLabs
        const idx = allText.indexOf(p);
        const prevText = idx > 0 ? allText[idx-1].c : "";
        const nextText = idx < allText.length-1 ? allText[idx+1].c : "";
        const b = await ttsClient(p.c, prevText, nextText);
        if (b) {
          normalizeBuffer(b);
          applyFade(b);
          bufs.push(b);
        }
      }
      if (bufs.length > 0) {
        let tot = bufs.reduce((s, b) => s + b.length, 0);
        let comb = actx.createBuffer(1, tot, sr);
        const ch = comb.getChannelData(0);
        let off = 0;
        for (const b of bufs) { ch.set(b.getChannelData(0), off); off += b.length; }

        // ─── Ralentissement WSOLA en mode v3 (préserve le pitch) ─────
        // v3 ignore le paramètre `speed` côté ElevenLabs → on ralentit ici.
        // La musique de fond se cale ensuite sur la nouvelle longueur (tot mis à jour).
        // Mickaël (réenregistré) et Valentin (whisper) sont à 1.00 → aucun traitement.
        if (useV3) {
          const wsolaSpeed = VOICE_WSOLA_SPEED[selectedVoice] || 1.00;
          if (wsolaSpeed < 0.99) {
            setFullGenMsg("Ajustement du tempo (préservation du pitch)...");
            comb = wsolaStretch(comb, wsolaSpeed, sr);
            tot = comb.length;
          }
        }

        // ─── NORMALISATION AUDIO réelle (scan peak + scaling) ─────
        const normalizeChannel = (channel, target = 0.95) => {
          let peak = 0;
          for (let i = 0; i < channel.length; i++) {
            const a = Math.abs(channel[i]);
            if (a > peak) peak = a;
          }
          if (peak > 0.0001) {
            const gain = target / peak;
            for (let i = 0; i < channel.length; i++) channel[i] *= gain;
          }
        };
        // Normalisation voix : -0.7 dBFS standard (0.92), MAIS plus bas pour
        // Valentin (whisper) → réduit les pics sibilants des "s" qui sinon
        // sont amplifiés par la normalisation et deviennent piquants au casque.
        const VALENTIN_ID = "cQVn2FWawJsxa2z9X3l1";
        const normTarget = (selectedVoice === VALENTIN_ID) ? 0.78 : 0.92;
        normalizeChannel(comb.getChannelData(0), normTarget);

        // Mixage musique de fond
        const MUSIC_URLS = {
          tambour: "https://hnuokd1cvass8ly7.public.blob.vercel-storage.com/music_tambour.mp3",
          coeur:   "https://hnuokd1cvass8ly7.public.blob.vercel-storage.com/music_coeur.mp3",
          nature:  "https://hnuokd1cvass8ly7.public.blob.vercel-storage.com/music_nature.mp3",
          relaxation: "https://hnuokd1cvass8ly7.public.blob.vercel-storage.com/music_nature.mp3",
        };

        const musicUrl = MUSIC_URLS[userData?.musicChoice || musicChoice];
        if (musicUrl) {
          try {
            setFullGenMsg("Chargement de la musique de fond...");
            // BÊTA : { cache: 'no-store' } pour récupérer la dernière version
            // de la musique sur Blob (au cas où on la remplace en cours de dev).
            const musicResp = await fetch(musicUrl, { cache: 'no-store' });
            const musicBuf = await actx.decodeAudioData(await musicResp.arrayBuffer());

            // ─── CROSSFADE 0.1s sur boucle musique (élimine le clic de jonction) ─
            const musicData = musicBuf.getChannelData(0);
            const loopLen = musicData.length;
            const FADE_SAMPLES = Math.min(Math.floor(sr * 0.1), Math.floor(loopLen / 4));
            const seamlessLoop = new Float32Array(loopLen);
            for (let i = 0; i < loopLen; i++) {
              if (i < FADE_SAMPLES) {
                // Fondu enchaîné : début du loop mixé avec la fin du loop précédent
                const fadeIn = i / FADE_SAMPLES;
                const fadeOut = 1 - fadeIn;
                seamlessLoop[i] = musicData[i] * fadeIn + musicData[loopLen - FADE_SAMPLES + i] * fadeOut;
              } else {
                seamlessLoop[i] = musicData[i];
              }
            }

            // Créer un buffer musique de la même durée que la voix en bouclant la version sans clic
            const mixBuf = actx.createBuffer(1, tot, sr);
            const mixCh = mixBuf.getChannelData(0);
            for (let i = 0; i < tot; i++) {
              mixCh[i] = seamlessLoop[i % loopLen];
            }

            // ─── Volume musical ADAPTATIF selon canal VAKOG ───
            // Auditif (A) → musique plus discrète pour ne pas saturer un canal déjà sensible aux sons
            // Visuel (V), Kinesthésique (K) → volume standard pour soutenir l'imagerie/sensation
            // Autres → entre les deux
            const VAKOG_MUSIC_VOLUME = { V: 0.20, A: 0.15, K: 0.20, O: 0.18, G: 0.18, R: 0.18 };
            const musicVolume = VAKOG_MUSIC_VOLUME[vakog] || 0.20;

            // ─── Fade-in 3s au début + Fade-out 5s en fin de séance ───
            // Évite l'attaque brutale de la musique et accompagne la sortie de l'état alpha en douceur
            const FADE_IN_SAMPLES = Math.min(Math.floor(sr * 3.0), Math.floor(tot / 4));
            const FADE_OUT_SAMPLES = Math.min(Math.floor(sr * 5.0), Math.floor(tot / 4));

            // Mixer voix normalisée (100%) + musique (volume adaptatif + fades) puis normaliser le mix final
            setFullGenMsg("Mixage voix et musique...");
            const finalBuf = actx.createBuffer(1, tot, sr);
            const finalCh = finalBuf.getChannelData(0);
            const voiceCh = comb.getChannelData(0);
            for (let i = 0; i < tot; i++) {
              // Calcul du gain musical avec fade-in / fade-out
              let musicGain = musicVolume;
              if (i < FADE_IN_SAMPLES) {
                musicGain *= i / FADE_IN_SAMPLES; // montée progressive
              } else if (i > tot - FADE_OUT_SAMPLES) {
                musicGain *= (tot - i) / FADE_OUT_SAMPLES; // descente progressive
              }
              finalCh[i] = voiceCh[i] + mixCh[i] * musicGain;
            }
            normalizeChannel(finalCh, 0.95); // Normalisation finale du mix
            // Encodage MP3 (10-15× plus léger que WAV) avec fallback WAV si lamejs absent
            setFullGenMsg("Encodage MP3 du mix final...");
            const finalMp3 = bufferToMp3(finalBuf, sr, 128);
            setAudioUrl(URL.createObjectURL(finalMp3));
            await persistPersonalSession(finalMp3);
          } catch(e) {
            // Si la musique échoue (404 Vercel Blob, réseau, decode...), on livre la voix seule.
            // BUG SILENCIEUX HISTORIQUE — corrigé 2026-05-09 : avant ce patch, l'erreur était
            // avalée sans trace, ce qui a masqué le fait que music_*.mp3 n'étaient pas uploadés
            // sur Vercel Blob → toutes les séances de prod sortaient en voix-seule sans alerte.
            console.error("[EUREKA] Échec chargement musique de fond — fallback voix seule.", { url: musicUrl, error: e?.message || e });
            track("music_fetch_failed", {
              choice: userData?.musicChoice || musicChoice || "?",
              error: (e?.message || String(e) || "?").substring(0, 80)
            });
            setFullGenMsg("Encodage MP3 (voix seule)...");
            const mp3 = bufferToMp3(comb, sr, 128);
            setAudioUrl(URL.createObjectURL(mp3));
            await persistPersonalSession(mp3);
          }
        } else {
          // Pas de musique de fond → voix seule en MP3
          setFullGenMsg("Encodage MP3...");
          const mp3 = bufferToMp3(comb, sr, 128);
          setAudioUrl(URL.createObjectURL(mp3));
          await persistPersonalSession(mp3);
        }

        setFullGenPhase("done");
        setFullGenMsg("Votre séance complète est prête ! Écoutez-la chaque jour pour ancrer la transformation.");
      }
    } catch(e) {
      track("gen_failed", { error: (e.message || "?").substring(0, 80) });
      setFullGenPhase("error");
      setFullGenMsg(e.message);
    }
  };

  // Sauvegarde la séance personnelle (audio Blob + metadata) dans IndexedDB.
  // Permet de la réécouter sans regénérer.
  // CHAQUE NOUVELLE SÉANCE = reset du streak (le streak ne compte que les écoutes
  // consécutives d'UNE séance personnelle, pas le nombre de séances créées).
  const persistPersonalSession = async (audioBlob) => {
    try {
      const sessionId = Date.now(); // identifiant unique pour l'historique
      const meta = {
        id: sessionId,
        savedAt: new Date().toISOString(),
        prenom,
        archetypeKey,
        archetypeName: archetype.name,
        bigFiveScores,
        // Compat avec l'affichage "savedMeta.mbtiName" sur la Landing :
        mbtiName: archetype.name,
        vakog,
        voiceId: selectedVoice,
        useV3Mode,
        problem: userData.problem || "",
        objectif: userData.objectif || "",
        durationApprox: audioBlob.size / 22050 / 2, // estimation pour WAV 22050Hz mono 16-bit
        // v_couple — Flag couple + prénoms individuels pour l'affichage différencié
        // dans MesSeances. Si !couple, ces 3 champs restent undefined (compat solo).
        couple: !!couple,
        person1Prenom: (couple && person1) ? person1.prenom : undefined,
        person2Prenom: (couple && person2) ? person2.prenom : undefined,
      };
      const fullData = { audioBlob, script, userData, ...meta };
      // 1. Sauvegarde "current" (séance active, pour bouton "Reprendre")
      await saveSession(fullData);
      // 2. Sauvegarde dans l'historique sous l'id timestamp + entrée meta légère en localStorage
      await saveSessionWithId(sessionId, fullData);
      addHistoryEntry(meta);
      setSessionFlag(true, meta);
      resetStreak();
      streakCountedRef.current = false;
      // Incrémente le compteur global de séances générées (pour déclencher
      // la capture d'intention tarifaire à la 5e séance)
      const newCount = incrementSessionCount();
      console.log("[EUREKA] Séance n°" + newCount + " générée (id:" + sessionId + ")");
    } catch (e) {
      console.warn("Persist personal session failed:", e);
    }
  };

  // Affichage / téléchargements : on retire les balises v3 (instructions vocales internes)
  const displayScript = (script || "").replace(V3_TAG_REGEX, "").replace(/  +/g, " ");

  const downloadScript = () => {
    const content = `EUREKA THÉRAPIE — Séance Personnalisée\n${"═".repeat(50)}\nPrénom : ${prenom}\nArchétype : ${archetype.icon} ${archetype.name}\nCanal dominant : ${VAKOG_NAMES[vakog]}\nDate : ${new Date().toLocaleDateString("fr-FR")}\nSéance n° : ${seanceNum}\n\n${displayScript}`;
    const blob = new Blob([content], { type:"text/plain;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `eureka_seance${seanceNum}_${prenom}_${archetypeKey}.txt`;
    a.click();
  };

  const downloadPDF = () => {
    try {
      if (!window.jspdf || !window.jspdf.jsPDF) {
        alert("Le module PDF n'est pas encore chargé. Réessayez dans quelques secondes.");
        return;
      }
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit:"mm", format:"a4" });
      const W = 210, M = 18, lineH = 5.5;
      let y = M;

      // En-tête
      doc.setFont("helvetica", "bold");
      doc.setFontSize(20);
      doc.setTextColor(184, 149, 90);
      doc.text("EUREKA Thérapie", W/2, y, { align:"center" });
      y += 8;
      doc.setFont("helvetica", "normal");
      doc.setFontSize(11);
      doc.setTextColor(120, 120, 120);
      doc.text("Sophrologie · Transformation personnalisée", W/2, y, { align:"center" });
      y += 10;

      // Bloc info profil
      doc.setDrawColor(184, 149, 90);
      doc.setLineWidth(0.3);
      doc.line(M, y, W - M, y);
      y += 6;
      doc.setFontSize(10);
      doc.setTextColor(60, 60, 60);
      doc.setFont("helvetica", "bold");
      doc.text("Prénom : ", M, y); doc.setFont("helvetica", "normal"); doc.text(prenom, M + 22, y);
      doc.setFont("helvetica", "bold");
      doc.text("Date : ", M + 100, y); doc.setFont("helvetica", "normal"); doc.text(new Date().toLocaleDateString("fr-FR"), M + 113, y);
      y += lineH;
      doc.setFont("helvetica", "bold");
      doc.text("Archétype : ", M, y); doc.setFont("helvetica", "normal"); doc.text(`${archetype.name}`, M + 26, y);
      y += lineH;
      doc.setFont("helvetica", "bold");
      doc.text("Canal sensoriel : ", M, y); doc.setFont("helvetica", "normal"); doc.text(VAKOG_NAMES[vakog] || vakog, M + 32, y);
      y += lineH;
      doc.setFont("helvetica", "bold");
      doc.text("Séance n° : ", M, y); doc.setFont("helvetica", "normal"); doc.text(String(seanceNum), M + 22, y);
      y += 4;
      doc.line(M, y, W - M, y);
      y += 8;

      // Corps du script
      doc.setFont("helvetica", "normal");
      doc.setFontSize(10);
      doc.setTextColor(40, 40, 40);
      const cleanScript = displayScript.replace(/\[PAUSE_[\d.]+s\]/gi, "  ⏸  ");
      const lines = doc.splitTextToSize(cleanScript, W - 2 * M);
      const lineHeight = 4.5;
      for (const ln of lines) {
        if (y > 280) {
          doc.addPage();
          y = M;
        }
        doc.text(ln, M, y);
        y += lineHeight;
      }

      // Pied de page
      doc.setFontSize(8);
      doc.setTextColor(150, 150, 150);
      doc.setFont("helvetica", "italic");

// APP PRINCIPALE

function bufferToWav(buffer, sampleRate) {
  const numCh = 1, bps = 16;
  const byteRate = sampleRate * numCh * bps / 8;
  const blockAlign = numCh * bps / 8;
  const dataLen = buffer.length * blockAlign;
  const ab = new ArrayBuffer(44 + dataLen);
  const v = new DataView(ab);
  const ws = (o, s) => { for (let i=0;i<s.length;i++) v.setUint8(o+i,s.charCodeAt(i)); };
  ws(0,'RIFF'); v.setUint32(4,36+dataLen,true); ws(8,'WAVE'); ws(12,'fmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,numCh,true);
  v.setUint32(24,sampleRate,true); v.setUint32(28,byteRate,true);
  v.setUint16(32,blockAlign,true); v.setUint16(34,bps,true); ws(36,'data');
  v.setUint32(40,dataLen,true);
  const d = buffer.getChannelData(0); let o = 44;
  for (let i=0;i<d.length;i++,o+=2) { const s=Math.max(-1,Math.min(1,d[i])); v.setInt16(o,s<0?s*0x8000:s*0x7FFF,true); }
  return new Blob([ab],{type:'audio/wav'});
}

// ─── WSOLA (Waveform Similarity Overlap-Add) — préserve le pitch ─────
// Algorithme inline équivalent qualité Audacity "Change Tempo + Haute qualité".
// Aucune dépendance externe, validé sur les générateurs PREVIEW Bella/Marcel.
// tempo < 1.0 = ralentissement ; 1.0 = aucun traitement (passe-droit).
function wsolaStretch(audioBuffer, tempo, sampleRate) {
  if (Math.abs(tempo - 1.0) < 0.005) return audioBuffer;

  const input = audioBuffer.getChannelData(0);
  const inputLen = input.length;

  // Paramètres adaptés à la voix sophro (taille fenêtre, sauts)
  const N = 2048;
  const Ha = Math.floor(N / 4);
  const Hs = Math.floor(Ha / tempo);
  const TolMax = 1024;

  const outputLen = Math.floor(inputLen / tempo);
  const output = new Float32Array(outputLen);

  // Fenêtre Hann (préservée par OLA avec Hs)
  const hann = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    hann[i] = 0.5 * (1 - Math.cos(2 * Math.PI * i / (N - 1)));
  }

  // Premier frame : pas de recherche
  for (let i = 0; i < N && i < outputLen; i++) {
    output[i] += input[i] * hann[i];
  }

  let xPos = Ha;
  let yPos = Hs;

  while (xPos + N + TolMax < inputLen && yPos + N < outputLen) {
    const target = output.subarray(yPos - Ha, yPos);

    let bestOffset = 0;
    let bestCorr = -Infinity;
    const maxOff = Math.min(TolMax, inputLen - xPos - N);
    const minOff = Math.max(-TolMax, -xPos);

    // Step 16 pour accélérer la recherche (~16x plus rapide, qualité quasi-identique)
    for (let off = minOff; off <= maxOff; off += 16) {
      let corr = 0;
      for (let i = 0; i < Ha; i++) {
        corr += input[xPos + off + i] * target[i];
      }
      if (corr > bestCorr) {
        bestCorr = corr;
        bestOffset = off;
      }
    }

    xPos += bestOffset;

    for (let i = 0; i < N && yPos + i < outputLen; i++) {
      output[yPos + i] += input[xPos + i] * hann[i];
    }

    yPos += Hs;
    xPos += Ha;
  }

  // Construire AudioBuffer de sortie
  const tempCtx = new (window.AudioContext || window.webkitAudioContext)();
  const outBuf = tempCtx.createBuffer(1, outputLen, sampleRate);
  outBuf.getChannelData(0).set(output);
  return outBuf;
}

// ─── Encodeur MP3 (lamejs) — fichiers 10-15× plus légers que WAV ──────
// Utilisé pour la séance complète : ~5-10 Mo en MP3 vs 80-150 Mo en WAV.
// Fallback automatique sur WAV si lamejs n'est pas chargé (résilience).
function bufferToMp3(buffer, sampleRate, bitrate = 128) {
  // Fallback de sécurité : si lamejs absent (CDN down), on retombe sur WAV
  if (typeof lamejs === 'undefined' || !lamejs.Mp3Encoder) {
    console.warn("[EUREKA] lamejs non chargé → fallback WAV");
    return bufferToWav(buffer, sampleRate);
  }
  try {
    const samples = buffer.getChannelData(0);
    const mp3Encoder = new lamejs.Mp3Encoder(1, sampleRate, bitrate); // mono, sampleRate Hz, bitrate kbps
    const sampleBlockSize = 1152; // taille bloc standard MP3
    const mp3Data = [];

    // Convertir Float32 [-1, +1] en Int16 [-32768, +32767]
    const int16Samples = new Int16Array(samples.length);
    for (let i = 0; i < samples.length; i++) {
      const s = Math.max(-1, Math.min(1, samples[i]));
      int16Samples[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
    }

    for (let i = 0; i < int16Samples.length; i += sampleBlockSize) {
      const sampleChunk = int16Samples.subarray(i, i + sampleBlockSize);
      const mp3buf = mp3Encoder.encodeBuffer(sampleChunk);
      if (mp3buf.length > 0) mp3Data.push(mp3buf);
    }
    const finalChunk = mp3Encoder.flush();
    if (finalChunk.length > 0) mp3Data.push(finalChunk);

    return new Blob(mp3Data, { type: 'audio/mp3' });
  } catch (e) {
    console.warn("[EUREKA] Encodage MP3 échoué :", e, "→ fallback WAV");
    return bufferToWav(buffer, sampleRate);
  }
}

// ─── Couple v1 — Placeholder pour les étapes pas encore implémentées ───
// Cet écran sera remplacé session par session par les vrais composants
// (Anamnèse paramétrée P1/P2, BigFive paramétré, etc.).
function CoupleStepPlaceholder({ label, onBack, onNext, isLast }) {
  return (
    <Card>
      <Logo small />
      <div style={{ padding:"2rem 1rem", textAlign:"center" }}>
        <div style={{ fontSize:"40px", marginBottom:"1rem" }}>🚧</div>
        <h2 style={{ fontFamily:"'Cormorant Garamond', serif", fontSize:"22px",
          color:C.cream, fontWeight:"400", marginBottom:"0.5rem" }}>{label}</h2>
        <p style={{ fontSize:"13px", color:C.muted, lineHeight:"1.6",
          marginBottom:"1.75rem", maxWidth:"380px", margin:"0 auto 1.75rem" }}>
          Cet écran sera implémenté dans une prochaine session de développement.
          Pour l'instant, vous pouvez naviguer entre les placeholders pour vérifier
          le routing.
        </p>
        <Btn onClick={onNext} variant="gold">
          {isLast ? "Terminer (retour à l'accueil)" : "Étape suivante →"}
        </Btn>
        <Btn onClick={onBack} variant="ghost" style={{ marginTop:"0.5rem" }}>
          ← Retour à l'accueil
        </Btn>
      </div>
    </Card>
  );
}

function App() {
  const [step, setStep] = useState("landing");
  const [userData, setUserData] = useState({});
  const [showMentions, setShowMentions] = useState(false);
  const [showTutorial, setShowTutorial] = useState(false);
  const [resumeData, setResumeData] = useState(null); // { audioBlob, script, userData } chargé depuis IDB

  // v26bis — ajout du step "genre-voix" entre Profil et Séance (consigne Mickaël 2026-05-08)
  const STEP_LABELS = ["Accueil","Présentation","Big Five","Sensoriel","Choix","Voix","Séance"];
  const STEP_INDEX = { landing:0, anamnese:1, bigfive:2, vakog:3, profil:4, "genre-voix":5, seance:6, pricing:6 };
  // v_couple — Liste des step IDs propres au parcours couple ; sert à masquer
  // le StepIndicator (chaque composant Anamnèse/BigFive/VAKOG a son propre indicateur
  // interne, et le funnel couple à 8 étapes ne match pas STEP_LABELS).
  const COUPLE_STEPS = ["anamnese-1","bigfive-1","vakog-1","anamnese-2","bigfive-2","vakog-2","profil-couple","genre-voix-couple","seance-couple"];

  // ─── Capture intention tarifaire — apparaît UNE fois à la 5e séance ──
  // On stocke le compteur de séances générées dans localStorage pour décider
  // quand afficher l'écran. Une fois affiché, on marque "shown" pour ne pas
  // le redéclencher à chaque future séance.

  const updateUser = (data) => setUserData(d => ({ ...d, ...data }));

  // Track la première vue de la landing au mount du composant App
  useEffect(() => { track("landing_view"); }, []);

  // ─── Auto-restore après refresh : si l'utilisateur était sur l'écran "seance"
  // et qu'une séance valide existe en IDB, la recharger automatiquement plutôt
  // que de retomber sur la landing (frustration "j'ai tout perdu").
  // sessionStorage (et pas localStorage) : on veut que ça expire à la fermeture
  // de l'onglet — sinon le navigateur restaurerait la séance même 2 jours après.
  useEffect(() => {
    let cancelled = false;
    const restore = async () => {
      try {
        const lastStep = sessionStorage.getItem('eureka_last_step');
        if (lastStep === 'seance' && getSessionFlag()) {
          const data = await loadSession();
          if (!cancelled && data && data.audioBlob) {
            track("session_auto_resumed_after_refresh");
            setResumeData(data);
            setStep("seance");
          }
        }
        // v_couple — Reprise du funnel couple (anamnese-1 → seance-couple)
        // après refresh navigateur. Le userData est restauré depuis sessionStorage,
        // les composants Anamnese/Quiz retrouvent leur état via leur propre localStorage.
        const _coupleSteps = ["anamnese-1","bigfive-1","vakog-1","anamnese-2","bigfive-2","vakog-2","profil-couple","genre-voix-couple","seance-couple"];
        if (lastStep && _coupleSteps.includes(lastStep)) {
          const _rawCouple = sessionStorage.getItem('eureka_couple_userdata');
          if (_rawCouple) {
            const _restored = JSON.parse(_rawCouple);
            if (!cancelled) {
              track("couple_funnel_auto_resumed", { step: lastStep });
              setUserData(_restored);
              setStep(lastStep);
            }
          }
        }
      } catch {}
    };
    restore();
    return () => { cancelled = true; };
  }, []);

  // Persiste le step courant dans sessionStorage (perdu à la fermeture de l'onglet).
  useEffect(() => {
    try { sessionStorage.setItem('eureka_last_step', step); } catch {}
  }, [step]);

  // Démarrage d'une nouvelle séance : reset streak + suppression séance sauvegardée + funnel from scratch
  const handleLandingNext = async () => {
    if (getSessionFlag()) {
      // Confirmation explicite seulement si une séance existe (sinon clic direct sans friction)
      const confirmed = window.confirm(
        "Une nouvelle séance va remplacer votre séance personnelle actuelle et remettre votre streak à zéro. Continuer ?"
      );
      if (!confirmed) { track("session_create_cancelled"); return; }
      await deleteSession();
      setSessionFlag(false);
      resetStreak();
    }
    track("anamnese_started");
    setStep("anamnese");
  };

  // ─── Couple v1 — démarrage du parcours à deux ────────────────────
  // Cleanup au démarrage : on efface toutes les clés liées à un parcours couple
  // précédent (anamnèses, quizzes, profil, userData) pour démarrer fresh.
  // L'auto-restore (cf useEffect ci-dessous) gère le cas refresh mid-funnel ;
  // ici on est sur un démarrage volontaire depuis la Landing.
  const handleStartCouple = () => {
    try {
      ['eureka_anamnese_p1_state', 'eureka_anamnese_p2_state',
       'eureka_quiz_bigfive_p1',   'eureka_quiz_bigfive_p2',
       'eureka_quiz_vakog_p1',     'eureka_quiz_vakog_p2',
       'eureka_profil_couple_state'].forEach(k => {
        try { localStorage.removeItem(k); } catch {}
      });
      sessionStorage.removeItem('eureka_couple_userdata');
    } catch {}
    setUserData({});
    track("couple_started");
    setStep("anamnese-1");
  };

  // ─── v_couple — Persistance userData en mode couple (sessionStorage) ───
  // Permet la reprise complète après refresh dans le funnel à 8 étapes.
  // Choix sessionStorage (cohérent avec le step) : expire à la fermeture d'onglet.
  useEffect(() => {
    if (userData.couple || userData.person1 || userData.person2) {
      try { sessionStorage.setItem('eureka_couple_userdata', JSON.stringify(userData)); } catch {}
    }
  }, [userData]);

  // ─── Couple v1 — helpers d'accumulation des données (structure imbriquée) ───
  // En mode couple, userData a deux sous-objets person1 et person2 (au lieu
  // de la structure plate du mode solo, qu'on ne touche pas).
  const updatePerson1 = (data) => setUserData(d => ({ ...d, person1: { ...(d.person1 || {}), ...data } }));
  const updatePerson2 = (data) => setUserData(d => ({ ...d, person2: { ...(d.person2 || {}), ...data } }));

  // ─── Couple v1 — handlers des 6 premières étapes (P1 + P2) ─────────
  const handleCoupleAnamneseP1 = (data) => {
    track("couple_anamnese_p1_completed");
    updatePerson1(data);
    setStep("bigfive-1");
  };
  const handleCoupleBigFiveP1 = (scores) => {
    track("couple_bigfive_p1_completed", { archetype: archetypeFromBigFive(scores) });
    updatePerson1({ bigFiveScores: scores });
    setStep("vakog-1");
  };
  const handleCoupleVAKOGP1 = (result) => {
    track("couple_vakog_p1_completed", { canal: result?.dominant || "?" });
    updatePerson1({ vakogResult: result });
    setStep("anamnese-2");
  };
  const handleCoupleAnamneseP2 = (data) => {
    track("couple_anamnese_p2_completed");
    updatePerson2(data);
    setStep("bigfive-2");
  };
  const handleCoupleBigFiveP2 = (scores) => {
    track("couple_bigfive_p2_completed", { archetype: archetypeFromBigFive(scores) });
    updatePerson2({ bigFiveScores: scores });
    setStep("vakog-2");
  };
  const handleCoupleVAKOGP2 = (result) => {
    track("couple_vakog_p2_completed", { canal: result?.dominant || "?" });
    updatePerson2({ vakogResult: result });
    setStep("profil-couple");
  };

  // ─── Couple v1 — handler du Profil commun (étape 7) ───
  // Stocke les choix partagés (relaxDir, beliefSystem, musicChoice, selectedVoice)
  // + flag couple: true + synthèse des champs au top level de userData pour
  // compatibilité avec SeancePlayer (qui destructure prenom/email/problem/objectif/
  // bigFiveScores/vakogResult). Les vraies données par personne (person1, person2)
  // sont préservées et utilisées par buildSystemPrompt couple.
  const handleProfilCoupleNext = (prefs) => {
    track("couple_profil_completed", {
      music: prefs.musicChoice || "?",
      belief: prefs.beliefSystem || "?"
    });
    setUserData(d => {
      const p1 = d.person1 || {};
      const p2 = d.person2 || {};
      // v_couple Session 8 — Capitalisation defensive des prénoms en cas où
      // l'Anamnèse onBlur ne se serait pas déclenchée (ex : Enter direct depuis le champ).
      const cap = s => (s && s.length > 0) ? (s.charAt(0).toUpperCase() + s.slice(1)) : "";
      const p1Prenom = cap(p1.prenom);
      const p2Prenom = cap(p2.prenom);
      return {
        ...d,
        ...prefs,
        couple: true,
        seanceNum: 1,
        // Champs synthétisés (SeancePlayer reste mono-mode)
        prenom: p1Prenom + " et " + p2Prenom,
        email: p1.email || p2.email || "",  // Session 5 enverra aussi à p2.email
        problem: "[" + (p1Prenom || "P1") + "] " + (p1.problem || "") + "\n[" + (p2Prenom || "P2") + "] " + (p2.problem || ""),
        objectif: "[" + (p1Prenom || "P1") + "] " + (p1.objectif || "") + "\n[" + (p2Prenom || "P2") + "] " + (p2.objectif || ""),
        bigFiveScores: p1.bigFiveScores,    // P1 prioritaire (sera override par couple block du prompt)
        vakogResult: p1.vakogResult,        // P1 prioritaire (sera override par couple block du prompt)
        // On met aussi les prénoms capitalisés dans person1/person2 pour que buildSystemPrompt
        // les reçoive correctement dans le bloc couple.
        person1: { ...p1, prenom: p1Prenom },
        person2: { ...p2, prenom: p2Prenom },
      };
    });
    // v_couple Session 13 — Passage par genre-voix-couple AVANT seance-couple
    // (aligne sur le pattern solo : Profil → GenreVoix → Séance avec démo+4 voix).
    setStep("genre-voix-couple");
  };

  // v_couple Session 13 — handler du choix de voix pour le couple
  const handleGenreVoixCoupleNext = (prefs) => {
    track("couple_genre_voix_completed", { gender: prefs.genderPref || "?" });
    setUserData(d => ({ ...d, ...prefs }));
    setStep("seance-couple");
  };

  // Reprend la séance personnelle sauvegardée
  const handleLandingResume = async () => {
    const data = await loadSession();
    if (!data || !data.audioBlob) {
      track("resume_failed", { reason: "no_data" });
      alert("Séance introuvable — elle a peut-être été effacée par votre navigateur.");
      setSessionFlag(false);
      return;
    }
    track("session_resumed");
    setResumeData(data);
    setStep("seance");
  };

  const handleAnamneseNext = (data) => {
    track("anamnese_completed");
    updateUser(data);
    setStep("bigfive");
  };

  const handleBigFiveNext = (bigFiveScores) => {
    track("bigfive_completed", { archetype: archetypeFromBigFive(bigFiveScores) });
    updateUser({ bigFiveScores });
    setStep("vakog");
  };

  const handleVAKOGNext = (vakogResult) => {
    track("vakog_completed", { canal: vakogResult?.dominant || "?" });
    updateUser({ vakogResult });
    setStep("profil");
  };

  const handleProfilNext = (prefs) => {
    track("profil_completed", {
      music: prefs.musicChoice || "?",
      belief: prefs.beliefSystem || "?"
    });
    updateUser({ ...prefs, seanceNum: 1 });
    // v26bis — nouveau flux : Profil → GenreVoix (au lieu de Séance directement)
    setStep("genre-voix");
  };

  // v26bis — handler pour l'écran GenreVoix (choix Femme/Homme pour l'extrait découverte)
  const handleGenreVoixNext = (prefs) => {
    track("genre_voix_completed", { gender: prefs.genderPref || "?" });
    updateUser(prefs);
    setStep("seance");
  };

  const handleRestart = () => {
    // Capture d'intention tarifaire : si on a atteint la 5e séance et qu'on
    // n'a pas encore montré l'écran, on l'affiche AVANT de retourner à la landing.
    if (getSessionCount() >= 5 && !hasShownPricingIntent()) {
      track("pricing_shown");
      markPricingIntentShown();
      setStep("pricing");
      return; // on ne réinitialise PAS userData, on en a besoin pour le prénom/archétype
    }
    setStep("landing");
    setUserData({});
    setResumeData(null);
  };

  const handlePricingContinue = () => {
    setStep("landing");
    setUserData({});
    setResumeData(null);
  };

  // Ouverture de l'écran historique
  const handleOpenHistory = () => {
    track("history_opened");
    setStep("history");
  };

  // Réutilisation d'une séance depuis l'historique : on injecte les données comme un "resume"
  const handleHistoryResume = (data) => {
    setResumeData(data);
    setStep("seance");
  };

  return (
    <div style={{ minHeight:"100vh", background:C.bg, display:"flex",
      flexDirection:"column", alignItems:"center", justifyContent:"center",
      padding:"clamp(1rem,3vw,2rem)" }}>

      {showMentions && <MentionsModal onClose={() => setShowMentions(false)} />}
      {showTutorial && <TutorielModal onClose={() => setShowTutorial(false)} />}

      {/* Fond décoratif */}
      <div style={{ position:"fixed", inset:0, pointerEvents:"none", overflow:"hidden", zIndex:0 }}>
        {[...Array(5)].map((_,i) => (
          <div key={i} style={{ position:"absolute",
            left:`${15+i*18}%`, top:`${10+i*15}%`,
            width:`${80+i*30}px`, height:`${80+i*30}px`,
            borderRadius:"50%", border:`1px solid rgba(184,149,90,${.04+i*.01})`,
            animation:`breathe ${4+i}s ease-in-out ${i*.5}s infinite` }} />
        ))}
      </div>

      <div style={{ position:"relative", zIndex:1, width:"100%",
        display:"flex", flexDirection:"column", alignItems:"center" }}>

        {/* v26 — Bandeau bêta visible sur TOUTES les pages (landing, parcours, séance, etc.).
            Déplacé ici depuis le composant Logo qui n'était pas appelé sur la landing. */}
        <BetaBanner />

        {/* Indicateur d'étape (caché sur landing, historique et parcours couple) */}
        {step !== "landing" && step !== "history" && !COUPLE_STEPS.includes(step) && (
          <StepIndicator
            current={STEP_INDEX[step] || 0}
            total={STEP_LABELS.length}
            labels={STEP_LABELS}
          />
        )}

        {step === "landing" && <Landing onStart={handleLandingNext} onStartCouple={handleStartCouple} onResume={handleLandingResume} onMentions={() => setShowMentions(true)} onTutorial={() => setShowTutorial(true)} onHistory={handleOpenHistory} />}
        {step === "history" && <MesSeances onBack={() => setStep("landing")} onResume={handleHistoryResume} />}
        {step === "anamnese" && <Anamnese onNext={handleAnamneseNext} />}
        {step === "bigfive" && <QuizBigFive prenom={userData.prenom} onComplete={handleBigFiveNext} />}
        {step === "vakog" && <QuizVAKOG prenom={userData.prenom} onComplete={handleVAKOGNext} />}
        {step === "profil" && (
          <ProfilResult prenom={userData.prenom} bigFiveScores={userData.bigFiveScores}
            vakogResult={userData.vakogResult} problem={userData.problem} onNext={handleProfilNext} />
        )}
        {step === "genre-voix" && (
          <GenreVoix onNext={handleGenreVoixNext} />
        )}
        {step === "seance" && (
          <SeancePlayer
            userData={resumeData ? resumeData.userData : userData}
            resumeData={resumeData}
            onRestart={handleRestart} />
        )}
        {step === "pricing" && (
          <PricingIntent
            prenom={userData.prenom}
            archetype={userData.bigFiveScores ? (ARCHETYPES[archetypeFromBigFive(userData.bigFiveScores)]?.name || "?") : "?"}
            onContinue={handlePricingContinue} />
        )}

        {/* ─── Couple v1 — Funnel 8 étapes ───
            Sessions 2 : les 6 premières étapes utilisent les vrais composants
            (Anamnèse / QuizBigFive / QuizVAKOG paramétrés par personId).
            Sessions 3-5 : profil-couple et seance-couple restent placeholders. */}
        {step === "anamnese-1" && <Anamnese personId={1} onNext={handleCoupleAnamneseP1} />}
        {step === "bigfive-1" && (
          <QuizBigFive personId={1} prenom={userData.person1?.prenom} onComplete={handleCoupleBigFiveP1} />
        )}
        {step === "vakog-1" && (
          <QuizVAKOG personId={1} prenom={userData.person1?.prenom} onComplete={handleCoupleVAKOGP1} />
        )}
        {step === "anamnese-2" && <Anamnese personId={2} onNext={handleCoupleAnamneseP2} />}
        {step === "bigfive-2" && (
          <QuizBigFive personId={2} prenom={userData.person2?.prenom} onComplete={handleCoupleBigFiveP2} />
        )}
        {step === "vakog-2" && (
          <QuizVAKOG personId={2} prenom={userData.person2?.prenom} onComplete={handleCoupleVAKOGP2} />
        )}
        {step === "profil-couple" && (
          <ProfilCouple person1={userData.person1} person2={userData.person2}
            onNext={handleProfilCoupleNext} />
        )}
        {/* v_couple Session 13 — Étape genre-voix réutilisée du flow solo
            (composant GenreVoix générique : 2 cartes Bella/Marcel). */}
        {step === "genre-voix-couple" && (
          <GenreVoix onNext={handleGenreVoixCoupleNext} />
        )}
        {step === "seance-couple" && (
          <SeancePlayer userData={userData} resumeData={null} onRestart={handleRestart} />
        )}

        <div style={{ display:"flex", gap:"1.5rem", alignItems:"center", marginTop:"2rem",
          flexWrap:"wrap", justifyContent:"center" }}>
          <p style={{ fontSize:"10px", color:C.hint, textAlign:"center",
            fontFamily:"'Raleway', sans-serif", letterSpacing:"1px" }}>
            EUREKA Thérapie · Sophrologie · Protocole personnalisé
          </p>
          <button onClick={() => setShowMentions(true)}
            style={{ background:"transparent", border:"none", color:C.hint, fontSize:"10px",
              cursor:"pointer", fontFamily:"'Raleway',sans-serif", textDecoration:"underline",
              letterSpacing:"1px", padding:0 }}>
            Mentions légales
          </button>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
