<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Le conseil du mois — EUREKA Thérapie</title>
  <meta name="description" content="Un point d'appui par mois pour ralentir, respirer, revenir à soi. Inspiré de la sophrologie et de l'hypnose ericksonienne." />

  <!-- Open Graph (Facebook, LinkedIn, etc.) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="EUREKA Thérapie" />
  <meta property="og:locale" content="fr_FR" />
  <meta property="og:title" content="Le conseil du mois — EUREKA Thérapie" />
  <meta property="og:description" content="Un point d'appui par mois pour revenir à soi. Inspiré de la sophrologie, de l'hypnose ericksonienne et de la méthode Silva." />
  <meta property="og:url" content="https://eureka-therapie.vercel.app/conseils.html" />
  <meta property="og:image" content="https://eureka-therapie.vercel.app/og-conseil.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="EUREKA Thérapie — Le conseil du mois" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Le conseil du mois — EUREKA Thérapie" />
  <meta name="twitter:description" content="Un point d'appui par mois pour revenir à soi." />
  <meta name="twitter:image" content="https://eureka-therapie.vercel.app/og-conseil.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #08191a;
      --panel: #0d2a2c;
      --card: #112e30;
      --border: #1a4548;
      --gold: #b8955a;
      --gold-light: #d4b483;
      --teal: #2a8a8f;
      --cream: #f0e8d8;
      --muted: #7a9ea0;
      --text: #e8f0f0;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Raleway', sans-serif;
      font-weight: 300;
      line-height: 1.7;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--gold-light); text-decoration: none; }
    a:hover { color: var(--gold); }

    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 4rem 1.5rem 6rem;
    }
    .brand {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.4rem;
      letter-spacing: 0.04em;
      color: var(--gold);
      text-align: center;
      margin-bottom: 0.25rem;
    }
    .brand .sep { color: var(--border); margin: 0 0.5rem; }
    .meta {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 3rem;
    }

    .article {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3rem 2.25rem;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .theme-tag {
      text-align: center;
      color: var(--gold);
      font-size: 0.78rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-family: 'Raleway', sans-serif;
      font-weight: 500;
      margin: 0 0 1.25rem;
    }
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 500;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      color: var(--cream);
      margin: 0 0 2rem;
      line-height: 1.25;
      text-align: center;
    }
    .ornament {
      width: 60px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 0 auto 2rem;
    }
    p {
      font-size: 1.05rem;
      color: var(--text);
      margin: 0 0 1.4rem;
    }
    p:last-child { margin-bottom: 0; }
    .section-label {
      font-family: 'Raleway', sans-serif;
      font-weight: 500;
      font-size: 0.78rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold);
      margin: 2rem 0 0.85rem;
    }
    .section-label:first-child { margin-top: 0; }

    .loading, .error {
      text-align: center;
      color: var(--muted);
      font-style: italic;
      padding: 2rem 0;
    }
    .error { color: #c87a6a; }

    .footer {
      margin-top: 4rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .footer a { display: inline-block; margin-top: 0.5rem; }

    /* Bloc admin (visible uniquement avec ?admin=KEY) */
    .admin {
      margin-top: 3rem;
      background: rgba(184, 149, 90, 0.08);
      border: 1px dashed var(--gold);
      border-radius: 16px;
      padding: 1.5rem;
    }
    .admin h3 {
      font-family: 'Raleway', sans-serif;
      font-weight: 500;
      color: var(--gold);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-size: 0.85rem;
      margin: 0 0 1rem;
    }
    .admin textarea {
      width: 100%;
      min-height: 200px;
      background: var(--bg);
      color: var(--cream);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      font-family: 'Raleway', sans-serif;
      font-size: 0.95rem;
      line-height: 1.6;
      resize: vertical;
    }
    .admin button {
      margin-top: 0.75rem;
      background: linear-gradient(135deg, var(--teal), #1e6668);
      color: var(--cream);
      border: none;
      padding: 0.65rem 1.25rem;
      border-radius: 8px;
      font-family: 'Raleway', sans-serif;
      letter-spacing: 0.08em;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .admin button:hover { filter: brightness(1.15); }
    .admin .ok { color: #6ec79e; font-size: 0.85rem; margin-left: 0.75rem; }

    @media (max-width: 600px) {
      .wrap { padding: 2rem 1rem 4rem; }
      .article { padding: 2rem 1.25rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">EUREKA <span class="sep">·</span> Thérapie</div>
    <div class="meta" id="meta">Le conseil du mois</div>

    <article class="article" id="article">
      <div class="loading">Chargement…</div>
    </article>

    <div class="admin" id="admin" style="display:none;">
      <h3>Mode propriétaire — Post Facebook prêt à coller</h3>
      <textarea id="fbText" readonly></textarea>
      <button id="copyBtn" type="button">Copier dans le presse-papier</button>
      <span class="ok" id="copyOk" style="display:none;">Copié ✓</span>
    </div>

    <div class="footer">
      <div>Un point d'appui par mois pour revenir à soi.</div>
      <a href="/">← Retour à EUREKA</a>
    </div>
  </div>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const adminKey = params.get('admin') || '';
      const url = '/api/conseil-lire' + (adminKey ? ('?admin=' + encodeURIComponent(adminKey)) : '');

      const article = document.getElementById('article');
      const metaEl = document.getElementById('meta');
      const adminBlock = document.getElementById('admin');
      const fbText = document.getElementById('fbText');
      const copyBtn = document.getElementById('copyBtn');
      const copyOk = document.getElementById('copyOk');

      // Formatage du mois (FR)
      const MOIS_FR = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
      function frMonth(yyyyMM) {
        if (!yyyyMM) return '';
        const m = yyyyMM.match(/^(\d{4})-(\d{2})$/);
        if (!m) return yyyyMM;
        const idx = parseInt(m[2], 10) - 1;
        return (MOIS_FR[idx] || '') + ' ' + m[1];
      }

      // Échappement HTML simple pour les paragraphes
      function esc(s) {
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }

      fetch(url)
        .then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(function (data) {
          if (data.error) throw new Error(data.error);
          if (data.month) metaEl.textContent = 'Le conseil de ' + frMonth(data.month);

          const title = esc(data.title || 'Le conseil du mois');
          const themeTag = data.themeLabel
            ? '<div class="theme-tag">' + esc(data.themeLabel) + '</div>'
            : '';
          // 4 sous-titres fonctionnels pour les 4 paragraphes du conseil
          const SECTION_LABELS = [
            'Ce que vous vivez',
            'Pourquoi c’est ainsi',
            'Un geste à pratiquer',
            'Pour aller plus loin'
          ];
          const body = data.body || [];
          // On affiche les sous-titres uniquement si on a exactement 4 paragraphes,
          // sinon (format ancien ou anomalie) on rend en prose sans labels.
          const useLabels = body.length === 4;
          const paras = body.map(function (p, i) {
            const label = useLabels
              ? '<div class="section-label">' + SECTION_LABELS[i] + '</div>'
              : '';
            return label + '<p>' + esc(p) + '</p>';
          }).join('');
          article.innerHTML =
            themeTag +
            '<h1>' + title + '</h1>' +
            '<div class="ornament"></div>' +
            paras;

          if (data.facebookPost) {
            adminBlock.style.display = 'block';
            fbText.value = data.facebookPost;
          }
        })
        .catch(function (err) {
          article.innerHTML = '<div class="error">Le conseil du mois n\'est pas disponible pour le moment.</div>';
          console.error(err);
        });

      copyBtn.addEventListener('click', function () {
        fbText.select();
        try {
          navigator.clipboard.writeText(fbText.value).then(function () {
            copyOk.style.display = 'inline';
            setTimeout(function () { copyOk.style.display = 'none'; }, 2000);
          });
        } catch (e) {
          document.execCommand && document.execCommand('copy');
          copyOk.style.display = 'inline';
          setTimeout(function () { copyOk.style.display = 'none'; }, 2000);
        }
      });
    })();
  </script>
</body>
</html>
